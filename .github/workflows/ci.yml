name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un unico run por rama: el evento `push` y el `pull_request` comparten
  # grupo, asi que el segundo cancela al primero en vez de duplicar la
  # corrida. Un push directo a una rama sin PR sigue teniendo su run.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Suite (unit + bootstrap + e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
          # El backend HTTP de drogon es opcional: si el paquete no esta, un
          # unico test falla por entorno y el resto de la suite sigue valida.
          # libjsoncpp-dev aporta las cabeceras `json/json.h` que drogon
          # incluye; libdrogon-dev solo arrastra el runtime de jsoncpp.
          # Drogon ademas de jsoncpp necesita libuuid (-luuid) y zlib (-lz).
          sudo apt-get install -y libdrogon-dev libjsoncpp-dev uuid-dev zlib1g-dev || echo "::warning::libdrogon-dev no disponible"

      - name: Install project (precompiles the C++ runtime)
        run: npm install

      - name: Unit + bootstrap test suite
        env:
          ESTATIC_ANALYSIS_JOBS: '2'
          ESTATIC_TEST_COMPARE_JOBS: '1'
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Preserve complete unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 7

      - name: End-to-end suite (compiles and runs real programs)
        # Se ejecuta siempre, incluso si la suite anterior falla: el e2e
        # compila y ejecuta programas reales, y es la senal mas valuable
        # cuando el resto ya esta verde.
        if: always()
        env:
          SKIP_NETWORK: '1'
        run: npm run test:e2e

  install:
    name: Instalación sin Node
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev

      - name: Install from the C++ seed without Node
        shell: bash
        run: |
          set -euo pipefail
          # Node queda envenenado: si install.sh lo invoca, falla la job.
          poison="$RUNNER_TEMP/without-node"
          mkdir -p "$poison"
          for tool in node nodejs npm; do
            printf '#!/bin/sh\necho forbidden > %s\nexit 99\n' "$RUNNER_TEMP/node-used" > "$poison/$tool"
            chmod +x "$poison/$tool"
          done
          rm -f "$RUNNER_TEMP/node-used"
          PATH="$poison:$PATH" NODE=/missing/node bash install.sh --prefix "$RUNNER_TEMP/prefix"
          test ! -e "$RUNNER_TEMP/node-used" || { echo "install.sh invocó Node"; exit 1; }
          export ESTC_ROOT="$RUNNER_TEMP/prefix/lib/estc/current"
          test -x "$RUNNER_TEMP/prefix/bin/etsc"
          test ! -e "$ESTC_ROOT/src"
          test -f "$ESTC_ROOT/bootstrap/modules/platform.hpp"
          test -z "$(find "$ESTC_ROOT/bootstrap" -type f -name '*.ets' -print -quit)"
          "$RUNNER_TEMP/prefix/bin/etsc" --version
          "$RUNNER_TEMP/prefix/bin/etsc" init "$RUNNER_TEMP/proyecto"
          cd "$RUNNER_TEMP/proyecto"
          "$RUNNER_TEMP/prefix/bin/etsc" build
          "$RUNNER_TEMP/prefix/bin/etsc" run

  includes:
    name: Regresión de includes (semilla C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build current C++ snapshot
        run: bash native-cpp/build-all.sh
      - name: Compile short includes programs (positive and negative)
        shell: bash
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-cpp"
          mkdir -p /tmp/estatic-includes
          compile_case() {
            local name="$1" expected="$2" source="$3"
            printf '%s\n' "$source" > "/tmp/estatic-includes/$name.ets"
            echo "::group::$name ($expected)"
            if native-cpp/native/etsc build "/tmp/estatic-includes/$name.ets" --binary "/tmp/estatic-includes/$name" --no-progress > "/tmp/estatic-includes/$name.log" 2>&1; then
              if [[ "$expected" != pass ]]; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Invalid case $name was accepted"
                exit 1
              fi
              test -x "/tmp/estatic-includes/$name"
            else
              if [[ "$expected" == pass ]]; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Valid case $name was rejected"
                exit 1
              fi
              if ! grep -Eq 'Aridad|argument|firma|compatible|tipo|type|error|ERROR' "/tmp/estatic-includes/$name.log"; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Invalid case $name failed without a diagnostic"
                exit 1
              fi
            fi
            echo "OK: $name ($expected)" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }
          compile_case one pass 'const s: string = "alpha"; print(s.includes("ph"));'
          compile_case two pass 'const s: string = "alpha"; print(s.includes("a", 1));'
          compile_case zero fail 'const s: string = "alpha"; print(s.includes());'
          compile_case three fail 'const s: string = "alpha"; print(s.includes("a", 0, 1));'
          compile_case wrong_type fail 'const s: string = "alpha"; print(s.includes(3));'
          compile_case wrong_offset fail 'const s: string = "alpha"; print(s.includes("a", "0"));'
          compile_case chained pass 'const s: string = "alpha"; print(s.substring(1, 4).includes("ph"));'
          compile_case nested pass 'const s: string = "alpha"; print(s.includes(s.charAt(0)));'
          compile_case loop pass 'const allowed: string = "abc"; const word: string = "cab"; for (let k: number = 0; k < 3; k = k + 1) { if (!allowed.includes(word.charAt(k))) print("bad"); }'
          compile_case conditional pass 'const s: string = "abc"; if (s.includes("a") && !s.includes("z", 1)) print("ok");'
          compile_case function_arg pass 'function check(s: string): boolean { return s.includes("x"); } print(check("xyz"));'
          compile_case checker_identifier pass 'function validSymbol(part:string):boolean { let valid:boolean=true; const allowedFirst:string="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_"; const allowedRest:string=allowedFirst+"0123456789"; if(!allowedFirst.includes(part.charAt(0))) valid=false; for(let k:number=1;k<part.length;k=k+1){if(!allowedRest.includes(part.charAt(k))) valid=false;} return valid; } print(validSymbol("abc_12"));'
