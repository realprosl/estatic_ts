name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Suite (unit + bootstrap + e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev

      - name: Install project (precompiles the C++ runtime)
        run: npm install

      - name: Unit + bootstrap test suite
        run: npm test

      - name: End-to-end suite (compiles and runs real programs)
        env:
          SKIP_NETWORK: '1'
        run: npm run test:e2e
