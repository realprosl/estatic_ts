name: CI

# Dos niveles:
# - Rápida (cada push a una PR): tests de la zona tocada (scripts/ci-tests.mjs)
#   repartidos en shards, más la regresión de includes como humo (construye la
#   semilla y compila programas cortos). Si solo cambia documentación no corre
#   nada. Objetivo: <10 min.
# - Completa: toda la suite en 4 shards + e2e + instalación sin Node, y en
#   ets-selfhost.yml / seed-prebuilt.yml el punto fijo y los binarios. Se lanza
#   con la etiqueta `ci-completa` en la PR, a mano (workflow_dispatch), en cada
#   push a main y cada noche. Ninguna PR se fusiona sin la completa en verde.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un único run por rama; poner `ci-completa` cancela la rápida en curso.
  # Otras etiquetas van a un grupo propio para no cancelar nada.
  group: ci-${{ github.head_ref || github.ref_name }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci-completa' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (qué se prueba)
    # Una etiqueta distinta de ci-completa no relanza nada.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci-completa'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Modo
        id: mode
        shell: bash
        run: |
          full=false
          if [[ "${{ github.event_name }}" != pull_request ]]; then full=true; fi
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci-completa') }}" == true ]]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Seleccionar tests
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mode.outputs.full }}" == true ]]; then
            node scripts/ci-tests.mjs --full --shards 4 > "$RUNNER_TEMP/plan.txt"
          else
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
            node scripts/ci-tests.mjs --changed "$RUNNER_TEMP/changed.txt" --shards 4 > "$RUNNER_TEMP/plan.txt"
          fi
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan de CI (${{ steps.mode.outputs.full == 'true' && 'completa' || 'rápida' }})"
            echo '```text'
            grep -v '^matrix=' "$RUNNER_TEMP/plan.txt"
            node -e 'const m=JSON.parse(process.argv[1].slice(7));for(const s of m.include)console.log(`shard ${s.shard}: ${s.tests}`)' "$(grep '^matrix=' "$RUNNER_TEMP/plan.txt")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # El frontend se construye con la semilla: el analisis de compiler/ con el
    # compilador nativo tarda mas que con stage 0.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure system dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(g++ libssl-dev libcurl4-openssl-dev libuv1-dev)
          missing=()
          apt_updated=0
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y "${missing[@]}"
            apt_updated=1
          else
            echo 'Native compiler and runtime dependencies already present on runner.'
          fi
          # El backend HTTP de drogon es opcional: si el paquete no esta, un
          # unico test falla por entorno y el resto de la suite sigue valida.
          # libjsoncpp-dev aporta las cabeceras `json/json.h` que drogon
          # incluye; libdrogon-dev solo arrastra el runtime de jsoncpp.
          # Drogon ademas de jsoncpp necesita libuuid (-luuid) y zlib (-lz).
          # Drogon nunca viene preinstalado: refresca los indices si el paso
          # anterior no lo hizo, para no degradar su test a un aviso por apt viejo.
          if ((apt_updated == 0)); then sudo apt-get -o Acquire::Retries=5 update; fi
          sudo apt-get -o Acquire::Retries=5 install -y libdrogon-dev libjsoncpp-dev uuid-dev zlib1g-dev || echo "::warning::libdrogon-dev no disponible"

      - name: Install project (precompiles the C++ runtime)
        run: npm install

      # El frontend nativo que usan los tests se construye con la semilla (el
      # camino de produccion): es el unico que resuelve los imports `estatic:*`.
      # Tarda mas que stage 0 (que no compila las librerias del runtime), pero
      # quita a stage 0 de la via de las pruebas.
      - name: Build the native compiler (seed)
        run: bash native-cpp/build-all.sh --out "$RUNNER_TEMP/seed"

      - name: Tests del shard
        env:
          ESTATIC_ANALYSIS_JOBS: '2'
          ESTATIC_TEST_COMPARE_JOBS: '1'
          ESTATIC_SEED: ${{ runner.temp }}/seed/etsc
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=1 ${{ matrix.tests }} 2>&1 | tee unit-test.log

      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ matrix.shard }}
          path: unit-test.log
          retention-days: 7

  e2e:
    name: End-to-end (completa)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure system dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(g++ libssl-dev libcurl4-openssl-dev libuv1-dev)
          missing=()
          apt_updated=0
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y "${missing[@]}"
            apt_updated=1
          else
            echo 'Native compiler and runtime dependencies already present on runner.'
          fi
          # El backend HTTP de drogon es opcional: si el paquete no esta, un
          # unico test falla por entorno y el resto de la suite sigue valida.
          # libjsoncpp-dev aporta las cabeceras `json/json.h` que drogon
          # incluye; libdrogon-dev solo arrastra el runtime de jsoncpp.
          # Drogon ademas de jsoncpp necesita libuuid (-luuid) y zlib (-lz).
          # Drogon nunca viene preinstalado: refresca los indices si el paso
          # anterior no lo hizo, para no degradar su test a un aviso por apt viejo.
          if ((apt_updated == 0)); then sudo apt-get -o Acquire::Retries=5 update; fi
          sudo apt-get -o Acquire::Retries=5 install -y libdrogon-dev libjsoncpp-dev uuid-dev zlib1g-dev || echo "::warning::libdrogon-dev no disponible"

      - name: Install project (precompiles the C++ runtime)
        run: npm install

      - name: End-to-end suite (compiles and runs real programs)
        env:
          SKIP_NETWORK: '1'
        run: npm run test:e2e

  install:
    name: Instalación sin Node
    runs-on: ubuntu-24.04
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure system dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(g++ libssl-dev libcurl4-openssl-dev libuv1-dev)
          missing=()
          apt_updated=0
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y "${missing[@]}"
            apt_updated=1
          else
            echo 'Native compiler and runtime dependencies already present on runner.'
          fi

      - name: Install from the C++ seed without Node
        shell: bash
        run: |
          set -euo pipefail
          # Node queda envenenado: si install.sh lo invoca, falla la job.
          poison="$RUNNER_TEMP/without-node"
          mkdir -p "$poison"
          for tool in node nodejs npm; do
            printf '#!/bin/sh\necho forbidden > %s\nexit 99\n' "$RUNNER_TEMP/node-used" > "$poison/$tool"
            chmod +x "$poison/$tool"
          done
          rm -f "$RUNNER_TEMP/node-used"
          PATH="$poison:$PATH" NODE=/missing/node bash install.sh --prefix "$RUNNER_TEMP/prefix"
          test ! -e "$RUNNER_TEMP/node-used" || { echo "install.sh invocó Node"; exit 1; }
          export ESTC_ROOT="$RUNNER_TEMP/prefix/lib/estc/current"
          test -x "$RUNNER_TEMP/prefix/bin/etsc"
          test ! -e "$ESTC_ROOT/src"
          test -f "$ESTC_ROOT/compiler/modules/platform.hpp"
          test -z "$(find "$ESTC_ROOT/compiler" -type f \( -name '*.ts' -o -name '*.ets' \) -print -quit)"
          "$RUNNER_TEMP/prefix/bin/etsc" --version
          "$RUNNER_TEMP/prefix/bin/etsc" init "$RUNNER_TEMP/proyecto"
          cd "$RUNNER_TEMP/proyecto"
          "$RUNNER_TEMP/prefix/bin/etsc" build
          "$RUNNER_TEMP/prefix/bin/etsc" run

  includes:
    name: Regresión de includes (semilla C++)
    runs-on: ubuntu-24.04
    needs: plan
    # Humo de la rápida: construye la semilla y compila programas cortos.
    if: needs.plan.outputs.count != '0'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build current C++ snapshot
        run: bash native-cpp/build-all.sh --force  # siempre comprueba que las fuentes de la semilla compilan
      - name: Compile short includes programs (positive and negative)
        shell: bash
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE"
          mkdir -p /tmp/estatic-includes
          compile_case() {
            local name="$1" expected="$2" source="$3"
            printf '%s\n' "$source" > "/tmp/estatic-includes/$name.ts"
            echo "::group::$name ($expected)"
            if native-cpp/native/etsc build "/tmp/estatic-includes/$name.ts" --binary "/tmp/estatic-includes/$name" --no-progress > "/tmp/estatic-includes/$name.log" 2>&1; then
              if [[ "$expected" != pass ]]; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Invalid case $name was accepted"
                exit 1
              fi
              test -x "/tmp/estatic-includes/$name"
            else
              if [[ "$expected" == pass ]]; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Valid case $name was rejected"
                exit 1
              fi
              if ! grep -Eq 'Aridad|argument|firma|compatible|tipo|type|error|ERROR' "/tmp/estatic-includes/$name.log"; then
                cat "/tmp/estatic-includes/$name.log"
                echo "::error::Invalid case $name failed without a diagnostic"
                exit 1
              fi
            fi
            echo "OK: $name ($expected)" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          }
          compile_case one pass 'const s: string = "alpha"; print(s.includes("ph"));'
          compile_case two pass 'const s: string = "alpha"; print(s.includes("a", 1));'
          compile_case zero fail 'const s: string = "alpha"; print(s.includes());'
          compile_case three fail 'const s: string = "alpha"; print(s.includes("a", 0, 1));'
          compile_case wrong_type fail 'const s: string = "alpha"; print(s.includes(3));'
          compile_case wrong_offset fail 'const s: string = "alpha"; print(s.includes("a", "0"));'
          compile_case chained pass 'const s: string = "alpha"; print(s.substring(1, 4).includes("ph"));'
          compile_case nested pass 'const s: string = "alpha"; print(s.includes(s.charAt(0)));'
          compile_case loop pass 'const allowed: string = "abc"; const word: string = "cab"; for (let k: number = 0; k < 3; k = k + 1) { if (!allowed.includes(word.charAt(k))) print("bad"); }'
          compile_case conditional pass 'const s: string = "abc"; if (s.includes("a") && !s.includes("z", 1)) print("ok");'
          compile_case function_arg pass 'function check(s: string): boolean { return s.includes("x"); } print(check("xyz"));'
          compile_case checker_identifier pass 'function validSymbol(part:string):boolean { let valid:boolean=true; const allowedFirst:string="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_"; const allowedRest:string=allowedFirst+"0123456789"; if(!allowedFirst.includes(part.charAt(0))) valid=false; for(let k:number=1;k<part.length;k=k+1){if(!allowedRest.includes(part.charAt(k))) valid=false;} return valid; } print(validSymbol("abc_12"));'
