name: Regenerate standalone native C++ snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/regenerate-native-cpp.yml
      - scripts/generate-native-cpp-snapshot.mjs

permissions:
  contents: read

concurrency:
  group: regenerate-native-cpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save original native-cpp layout and existing build helpers
        run: |
          set -euo pipefail
          for item in frontend bootstrap src runtime types templates build build-all.sh README.md files.txt; do
            test -e "native-cpp/$item" || { echo "::error::Missing $item"; exit 1; }
          done
          find native-cpp -mindepth 1 -maxdepth 1 -printf '%f %y\n' | LC_ALL=C sort > "$RUNNER_TEMP/layout.before"
          cp native-cpp/build-all.sh "$RUNNER_TEMP/build-all.sh"
          cp native-cpp/README.md "$RUNNER_TEMP/README.md"
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Generate C++ from bootstrap using src stage 0
        run: |
          set -euo pipefail
          rm -rf native-cpp
          node --experimental-strip-types scripts/generate-native-cpp-snapshot.mjs
      - name: Assemble source-only C++ compiler package
        run: |
          set -euo pipefail
          d=native-cpp
          mkdir -p "$d/src/codegen/ir" "$d/bootstrap/modules"
          cp -a src/codegen/ir/native "$d/src/codegen/ir/"
          cp -a bootstrap/native "$d/bootstrap/"
          find bootstrap/modules -maxdepth 1 -type f \( -name '*.hpp' -o -name '*.h' \) -exec cp {} "$d/bootstrap/modules/" \;
          cp -a runtime "$d/"
          cp -a types "$d/"
          # Retain the JSON-native templates produced by the generator.
          cp "$RUNNER_TEMP/build-all.sh" "$d/build-all.sh"
          chmod +x "$d/build-all.sh"
          cp "$RUNNER_TEMP/README.md" "$d/README.md"
          sed -i 's/native-cpp-bootstrap.yml/regenerate-native-cpp.yml/g' "$d/README.md"
          (cd "$d" && find . -type f | LC_ALL=C sort > files.txt)

      - name: Validate complete snapshot, structure and source-only policy
        run: |
          set -euo pipefail
          for item in frontend/unity.cpp frontend/estatic_common.hpp bootstrap/native/driver.cpp src/codegen/ir/native/generator.cpp build/bootstrap/etsc/install_config.hpp build/bootstrap/etsc/native-tables.hpp build-all.sh README.md files.txt templates/estatic.config.json templates/src/main.ts; do
            test -f "native-cpp/$item" || { echo "::error::Missing generated file: $item"; exit 1; }
          done
          for item in frontend bootstrap src runtime types templates build; do
            test -d "native-cpp/$item" || { echo "::error::Missing directory: $item"; exit 1; }
          done
          test -n "$(find native-cpp/frontend -name 'unit-*.cpp' -print -quit)"
          find native-cpp -mindepth 1 -maxdepth 1 -printf '%f %y\n' | LC_ALL=C sort > "$RUNNER_TEMP/layout.after"
          diff -u "$RUNNER_TEMP/layout.before" "$RUNNER_TEMP/layout.after"
          # Templates under templates/ may contain ETS/TS; compiler sources may not.
          bad_sources="$(find native-cpp -type f \( -name '*.ets' -o \( -name '*.ts' ! -name '*.d.ts' \) \) ! -path 'native-cpp/templates/*' -print)"
          if [ -n "$bad_sources" ]; then
            echo "::error::Unexpected ETS/TS compiler sources"
            printf '%s\n' "$bad_sources"
            exit 1
          fi
          bad_objects="$(find native-cpp -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.exe' \) -print)"
          if [ -n "$bad_objects" ] || [ -d native-cpp/native ]; then
            echo "::error::Prebuilt binaries in source-only snapshot"
            printf '%s\n' "$bad_objects"
            exit 1
          fi
          (cd native-cpp && find . -type f | LC_ALL=C sort | diff -u files.txt -)

      - name: Upload regenerated source tree
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-regenerated-sources
          path: native-cpp/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Download source snapshot to isolated verification directory
        uses: actions/download-artifact@v4
        with:
          name: native-cpp-regenerated-sources
          path: verify/native-cpp

      - name: Build compiler from downloaded snapshot (no Node or TS)
        run: |
          set -euo pipefail
          cd verify/native-cpp
          bash build-all.sh
          test -x native/frontend
          test -x native/etsc
          ./native/etsc --version

      - name: Compile and run standalone ETS smoke test
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/verify/native-cpp"
          mkdir -p "$RUNNER_TEMP/native-smoke"
          verify/native-cpp/native/etsc build examples/hello.ets \
            -o "$RUNNER_TEMP/native-smoke/hello.cpp" \
            --binary "$RUNNER_TEMP/native-smoke/hello" --no-progress
          test -s "$RUNNER_TEMP/native-smoke/hello.cpp"
          test -x "$RUNNER_TEMP/native-smoke/hello"
          "$RUNNER_TEMP/native-smoke/hello" > "$RUNNER_TEMP/native-smoke/output"
          printf 'Hola, mundo\n120\n' > "$RUNNER_TEMP/native-smoke/expected"
          diff -u "$RUNNER_TEMP/native-smoke/expected" "$RUNNER_TEMP/native-smoke/output"

      - name: Publish only tested sources
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A native-cpp
          if git diff --cached --quiet; then
            echo 'Regenerated source snapshot is identical; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="build/native-cpp-snapshot-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m 'build(native-cpp): verified regenerated standalone compiler'
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
            --title "build(native-cpp): verified standalone compiler snapshot" \
            --body "Generated using bootstrap/ir/demo.ets and src stage 0. Downloaded snapshot was rebuilt with g++ and passed an ETS executable smoke test."; then
            echo "::warning::Branch pushed, but PR creation was denied by GitHub Actions permissions."
            echo "Create a PR for branch $branch manually." >> "$GITHUB_STEP_SUMMARY"
          fi
