name: Regenerate native C++ seed

# Regenera la semilla (native-cpp/compiler/unity.cpp) con el propio compilador:
# native-cpp/regenerate.sh itera hasta el punto fijo (dos rondas que emiten el
# mismo IR y el mismo C++). No necesita Node ni src/. Después reconstruye la
# semilla desde el resultado, la prueba y, si se lanzó a mano, abre una PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/regenerate-native-cpp.yml
      - native-cpp/regenerate.sh
      - native-cpp/build-all.sh
      - native-cpp/build-compiler.sh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-native-cpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install C++ dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y g++

      - name: Record hand-written seed files
        run: |
          set -euo pipefail
          for item in build-all.sh build-compiler.sh fetch-prebuilt.sh regenerate.sh README.md; do
            test -f "native-cpp/$item" || { echo "::error::Missing $item"; exit 1; }
          done
          sha256sum native-cpp/*.sh native-cpp/README.md > "$RUNNER_TEMP/handwritten.sha256"
          find native-cpp/templates -type f -exec sha256sum {} + > "$RUNNER_TEMP/templates.sha256"

      - name: Regenerate the seed up to the fixed point (no Node)
        run: bash native-cpp/regenerate.sh

      - name: Validate structure
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/handwritten.sha256"
          sha256sum -c "$RUNNER_TEMP/templates.sha256"
          test -s native-cpp/compiler/unity.cpp
          test ! -e native-cpp/prebuilt || { echo "::error::native-cpp/prebuilt must be removed"; exit 1; }
          for item in runtime bootstrap src types; do
            if [ -e "native-cpp/$item" ]; then echo "::error::native-cpp/$item must not exist"; exit 1; fi
          done
          bad="$(find native-cpp -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.dylib' -o -name '*.exe' \) -not -path 'native-cpp/native/*' -print)"
          if [ -n "$bad" ]; then echo "::error::Binaries in the seed"; printf '%s\n' "$bad"; exit 1; fi
          (cd native-cpp && find . -type f -not -path './native/*' -not -path './prebuilt/*' | LC_ALL=C sort | diff -u files.txt -)

      - name: Build and smoke-test the regenerated seed
        run: |
          set -euo pipefail
          bash native-cpp/build-all.sh --force
          native-cpp/native/etsc --version
          export ESTC_ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/native-smoke"
          native-cpp/native/etsc build examples/hello.ets \
            -o "$RUNNER_TEMP/native-smoke/hello.cpp" \
            --binary "$RUNNER_TEMP/native-smoke/hello" --no-progress
          printf 'Hola, mundo\n120\n' > "$RUNNER_TEMP/native-smoke/expected"
          "$RUNNER_TEMP/native-smoke/hello" | diff -u "$RUNNER_TEMP/native-smoke/expected" -

      - name: Publish only tested sources
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf native-cpp/native
          git add -A native-cpp
          if git diff --cached --quiet; then
            echo 'Regenerated seed is identical; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="build/native-cpp-seed-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m 'build(native-cpp): semilla regenerada (punto fijo)'
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "build(native-cpp): semilla regenerada" \
            --body "native-cpp/regenerate.sh: punto fijo alcanzado; semilla reconstruida y probada con hello.ets." \
            || echo "::warning::Branch $branch pushed; create the PR manually." >> "$GITHUB_STEP_SUMMARY"
