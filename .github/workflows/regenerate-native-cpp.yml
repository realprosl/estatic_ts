name: Regenerate standalone native C++ snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/regenerate-native-cpp.yml
      - scripts/generate-native-cpp-snapshot.mjs
      - native-cpp/build-all.sh
      - native-cpp/build-compiler.sh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-native-cpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check hand-written seed files exist
        run: |
          set -euo pipefail
          # The generator rewrites only frontend/, build/, templates/, files.txt and
          # deletes prebuilt/; these hand-written files must stay untouched.
          for item in build-all.sh build-compiler.sh README.md; do
            test -f "native-cpp/$item" || { echo "::error::Missing $item"; exit 1; }
          done
          sha256sum native-cpp/build-all.sh native-cpp/build-compiler.sh native-cpp/README.md > "$RUNNER_TEMP/handwritten.sha256"
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Generate C++ from bootstrap using src stage 0
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generate-native-cpp-snapshot.mjs
      - name: Hand-written files untouched by the generator
        run: sha256sum -c "$RUNNER_TEMP/handwritten.sha256"

      - name: Validate complete snapshot, structure and source-only policy
        run: |
          set -euo pipefail
          for item in frontend/unity.cpp frontend/estatic_common.hpp build/bootstrap/etsc/install_config.hpp build/bootstrap/etsc/native-tables.hpp build-all.sh build-compiler.sh README.md files.txt templates/estatic.config.json templates/src/main.ts; do
            test -f "native-cpp/$item" || { echo "::error::Missing generated file: $item"; exit 1; }
          done
          for item in frontend templates build; do
            test -d "native-cpp/$item" || { echo "::error::Missing directory: $item"; exit 1; }
          done
          for item in runtime bootstrap src types; do
            if [ -e "native-cpp/$item" ]; then echo "::error::native-cpp/$item must not exist: shared sources live at the repository root"; exit 1; fi
          done
          test -n "$(find native-cpp/frontend -name 'unit-*.cpp' -print -quit)"
          # Stale precompiled binaries are removed; seed-prebuilt.yml rebuilds them on main.
          test ! -e native-cpp/prebuilt || { echo "::error::native-cpp/prebuilt must be removed by the regeneration"; exit 1; }
          # Templates under templates/ may contain ETS/TS; compiler sources may not.
          bad_sources="$(find native-cpp -type f \( -name '*.ets' -o \( -name '*.ts' ! -name '*.d.ts' \) \) ! -path 'native-cpp/templates/*' -print)"
          if [ -n "$bad_sources" ]; then
            echo "::error::Unexpected ETS/TS compiler sources"
            printf '%s\n' "$bad_sources"
            exit 1
          fi
          bad_objects="$(find native-cpp -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.dylib' -o -name '*.exe' \) -print)"
          if [ -n "$bad_objects" ] || [ -d native-cpp/native ]; then
            echo "::error::Prebuilt binaries in source-only snapshot"
            printf '%s\n' "$bad_objects"
            exit 1
          fi
          (cd native-cpp && find . -type f | LC_ALL=C sort | diff -u files.txt -)

      - name: Upload regenerated source tree
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-regenerated-sources
          path: native-cpp/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Replace the seed with the downloaded snapshot
        run: rm -rf native-cpp
      - name: Download source snapshot into native-cpp
        uses: actions/download-artifact@v4
        with:
          name: native-cpp-regenerated-sources
          path: native-cpp

      - name: Build compiler from downloaded snapshot (no Node or TS)
        run: |
          set -euo pipefail
          bash native-cpp/build-all.sh --force
          test -x native-cpp/native/frontend
          test -x native-cpp/native/etsc
          native-cpp/native/etsc --version

      - name: Compile and run standalone ETS smoke test
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/native-smoke"
          native-cpp/native/etsc build examples/hello.ets \
            -o "$RUNNER_TEMP/native-smoke/hello.cpp" \
            --binary "$RUNNER_TEMP/native-smoke/hello" --no-progress
          test -s "$RUNNER_TEMP/native-smoke/hello.cpp"
          test -x "$RUNNER_TEMP/native-smoke/hello"
          "$RUNNER_TEMP/native-smoke/hello" > "$RUNNER_TEMP/native-smoke/output"
          printf 'Hola, mundo\n120\n' > "$RUNNER_TEMP/native-smoke/expected"
          diff -u "$RUNNER_TEMP/native-smoke/expected" "$RUNNER_TEMP/native-smoke/output"

      - name: Verify snapshot frontend can analyze bootstrap itself
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Exercise the downloaded frontend against the full current compiler,
          # including the nested one-argument includes calls in checker.ets.
          native-cpp/native/frontend bootstrap/ir/demo.ets --verbose \
            > "$RUNNER_TEMP/bootstrap-self-ir.json"
          node --input-type=module - "$RUNNER_TEMP/bootstrap-self-ir.json" <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const ir = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.equal(ir.format, "ets-ir-2");
          assert.equal(ir.success, true, JSON.stringify(ir.diagnostics));
          assert.deepEqual(ir.diagnostics, []);
          JS

      - name: Publish only tested sources
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf native-cpp/native
          git add -A native-cpp
          if git diff --cached --quiet; then
            echo 'Regenerated source snapshot is identical; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="build/native-cpp-snapshot-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m 'build(native-cpp): verified regenerated standalone compiler'
          git push origin "$branch"
          if ! gh pr create --base main --head "$branch" \
            --title "build(native-cpp): verified standalone compiler snapshot" \
            --body "Generated using bootstrap/ir/demo.ets and src stage 0. Downloaded snapshot was rebuilt with g++ and passed an ETS executable smoke test."; then
            echo "::warning::Branch pushed, but PR creation was denied by GitHub Actions permissions."
            echo "Create a PR for branch $branch manually." >> "$GITHUB_STEP_SUMMARY"
          fi
