name: Version bump on merge

# Cada PR fusionada en main sube la versión en el acto, con un commit directo
# en main: +1 minor en package.json "version" y +1 en "estaticRevision".
# No hay PR intermedia que fusionar a mano.
#
# - Idempotente: el commit lleva el trailer "Version-Bump-Source-PR: #N"; si ya
#   está en main, no se vuelve a subir.
# - Serializado (concurrency) y con reintentos: si main avanza entre medias
#   (otra fusión, seed-prebuilt.yml...), rehace el incremento sobre el main nuevo.
# - Un push con GITHUB_TOKEN no dispara otros workflows, así que no hay bucles.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'automation/version-bump-')
    runs-on: ubuntu-latest
    env:
      SOURCE_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Bump version on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            if git log -n 200 --format=%B origin/main | grep -Fxq "Version-Bump-Source-PR: #$SOURCE_PR"; then
              echo "PR #$SOURCE_PR ya tiene su incremento en main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            version="$(node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) throw new Error('Unsupported version: ' + pkg.version);
          if (!Number.isSafeInteger(pkg.estaticRevision)) throw new Error('Invalid estaticRevision');
          pkg.version = `${match[1]}.${Number(match[2]) + 1}.0`;
          pkg.estaticRevision += 1;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          process.stdout.write(`${pkg.version} (v${pkg.estaticRevision})`);
          NODE
            )"
            git add package.json
            git commit -q -m "chore(release): v${version%% *} for merged PR #$SOURCE_PR" \
              -m "Version-Bump-Source-PR: #$SOURCE_PR"
            if git push origin HEAD:main; then
              echo "PR #$SOURCE_PR → $version" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main avanzó; reintento $attempt"
            sleep $((attempt * 5))
          done
          echo "::error::No se pudo subir el incremento de versión a main"
          exit 1
