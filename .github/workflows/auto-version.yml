name: Propose minor version bump

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-version-main
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'automation/version-bump-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/version-bump-next
      SOURCE_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Accumulate one bump for this merged PR
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          open_pr="$(gh pr list --state open --base main --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if git log --format=%B "origin/main..HEAD" | grep -Fxq "Version-Bump-Source-PR: #$SOURCE_PR"; then
              echo "Already counted PR #$SOURCE_PR"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) throw new Error('Unsupported version: ' + pkg.version);
          if (!Number.isSafeInteger(pkg.estaticRevision)) throw new Error('Invalid estaticRevision');
          pkg.version = `${match[1]}.${Number(match[2]) + 1}.0`;
          pkg.estaticRevision += 1;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE
          git add package.json
          git commit -m "chore(release): bump for merged PR #$SOURCE_PR" -m "Version-Bump-Source-PR: #$SOURCE_PR"
          if [[ -n "$open_pr" ]]; then
            git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "+HEAD:refs/heads/$BRANCH"
          fi

      - name: Open or update release PR
        if: steps.bump.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --base main --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): v${{ steps.bump.outputs.version }}" \
              --body "Acumula un incremento minor y uno de estaticRevision por cada PR normal fusionada en main. Requiere merge manual; no hace push a main ni crea tags."
          else
            gh pr edit "$existing" --title "chore(release): v${{ steps.bump.outputs.version }}"
          fi
