name: Verificar ZIP C++ bootstrap autónomo

on:
  workflow_run:
    workflows:
      - Generar fuentes C++ del compilador bootstrap
    types: [completed]
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de la ejecución generadora (vacío = última exitosa)'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Obtener fuentes bootstrap como entradas de prueba
        uses: actions/checkout@v4
        with:
          path: reference
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Instalar dependencias C++ (sin Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Descargar exclusivamente el artifact de la Action generadora
        uses: actions/download-artifact@v4
        with:
          name: etsc-bootstrap-cpp-sources
          path: package
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirmar que el ZIP no incluye binarios
        run: |
          set -euo pipefail
          test -f package/frontend/unity.cpp
          test -f package/bootstrap/native/driver.cpp
          test -f package/src/codegen/ir/native/generator.cpp
          if find package -type f \( -name '*.ets' -o -name '*.ts' -a ! -name '*.d.ts' -o -name '*.o' -o -name '*.a' -o -name '*.so' \) | grep .; then exit 1; fi
          if find package -type f -exec file {} + | grep -E 'ELF.*(executable|shared object)'; then exit 1; fi
      - name: Reconstruir ambos ejecutables usando solo el ZIP
        run: |
          cd package
          bash ./build-all.sh
          ./native/etsc --version
          test -x native/frontend
      - name: Recompilar los siete componentes de bootstrap con el compilador del ZIP
        shell: bash
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/package"
          cd reference
          mkdir -p "$GITHUB_WORKSPACE/selfhost"
          for component in lexer parser frontend modules binder checker ir; do
            echo "::group::Autocompilación de bootstrap/$component"
            "$ESTC_ROOT/native/etsc" build "bootstrap/$component/demo.ets" \
              -o "$GITHUB_WORKSPACE/selfhost/$component.cpp" \
              --binary "$GITHUB_WORKSPACE/selfhost/$component" \
              --no-progress
            test -s "$GITHUB_WORKSPACE/selfhost/$component.cpp"
            test -x "$GITHUB_WORKSPACE/selfhost/$component"
            echo "OK: bootstrap/$component/demo.ets" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          echo 'Los siete componentes de bootstrap se han recompilado con el compilador reconstruido desde el ZIP.' >> "$GITHUB_STEP_SUMMARY"
