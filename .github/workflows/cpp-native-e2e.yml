name: CPP Native E2E
on:
  push:
    branches: [test/cpp-native-e2e]
  pull_request:
    paths:
      - 'experiments/cpp-native/**'
      - 'bootstrap/**'
      - 'src/**'
      - '.github/workflows/cpp-native-e2e.yml'
  workflow_dispatch:

jobs:
  cpp-native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libuv1-dev libcurl4-openssl-dev libdrogon-dev libjsoncpp-dev uuid-dev pkg-config
      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile and run native bindings
        env:
          CPLUS_INCLUDE_PATH: /usr/include/jsoncpp
        run: |
          node --experimental-strip-types bootstrap/ir/cpp.ts experiments/cpp-native/e2e-main.ets -o build/cpp-native-e2e.cpp --binary build/cpp-native-e2e --build
          ./build/cpp-native-e2e > build/cpp-native-e2e.out
          printf '5\nHola, ETS\nOK\nERROR\n' > build/cpp-native-e2e.expected
          diff -u build/cpp-native-e2e.expected build/cpp-native-e2e.out
