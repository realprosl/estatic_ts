name: analyzeProject instrumentation (#63)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'src/**'
      - 'runtime/**'
      - 'native-compiler-mini/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  push:
    branches: [main, feature/native-self-hosting]
    paths:
      - 'bootstrap/**'
      - 'src/**'
      - 'runtime/**'
      - 'native-compiler-mini/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  trace-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Rebuild reference compiler from committed C++ snapshot
        run: bash native-compiler-mini/build-all.sh
      - name: Compile frontend containing the opt-in trace path
        env:
          ESTC_ROOT: ${{ github.workspace }}/native-compiler-mini
        run: |
          mkdir -p build/analysis-trace
          native-compiler-mini/native/etsc build bootstrap/ir/demo.ets \
            -o build/analysis-trace/frontend.cpp --binary build/analysis-trace/frontend --no-progress
      - name: Verify quiet/traced IR equality, phase ordering and error paths
        env:
          ESTATIC_ANALYSIS_FRONTEND: ${{ github.workspace }}/build/analysis-trace/frontend
        run: node --experimental-strip-types --test bootstrap/ir/analysis-trace.test.ts
      - name: Verify checker, expansion and binder semantics
        run: node --experimental-strip-types --test --test-concurrency=1 bootstrap/binder/binder.test.ts bootstrap/checker/checker.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-project-trace-contract
          path: build/analysis-trace/
          if-no-files-found: warn
