name: Seed and compiler prebuilt (Linux + macOS)

# Compila en cada plataforma, con enlace autocontenido:
#   - la semilla C++ (native-cpp/build-all.sh --update-prebuilt) y
#   - el compilador de bootstrap/ (native-cpp/build-compiler.sh --update-prebuilt),
# comprueba que no dependen de librerías dinámicas de terceros, los prueba y,
# en main, los guarda en native-cpp/prebuilt/<plataforma>/ con la huella de sus
# fuentes. install.sh solo los usa si esa huella coincide con el checkout.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - native-cpp/frontend/**
      - native-cpp/build/**
      - native-cpp/build-all.sh
      - bootstrap/**
      - native-cpp/build-compiler.sh
      - src/codegen/ir/native/**
      - runtime/**
      - .github/workflows/seed-prebuilt.yml
  push:
    branches: [main]
    paths:
      - native-cpp/frontend/**
      - native-cpp/build/**
      - native-cpp/build-all.sh
      - bootstrap/**
      - native-cpp/build-compiler.sh
      - src/codegen/ir/native/**
      - runtime/**
      - .github/workflows/seed-prebuilt.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seed-prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install static build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y g++ libssl-dev
          test -f /usr/lib/x86_64-linux-gnu/libcrypto.a

      - name: Install static build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.a"

      - name: Build self-contained seed
        run: bash native-cpp/build-all.sh --update-prebuilt --out "$RUNNER_TEMP/seed"

      - name: Build self-contained bootstrap compiler
        id: compiler
        # macOS: el runtime aún no está portado del todo; si falla, se publica
        # solo la semilla y install.sh compila el compilador allí.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: bash native-cpp/build-compiler.sh --seed "$RUNNER_TEMP/seed" --out "$RUNNER_TEMP/compiler/etsc" --update-prebuilt

      - name: Verify no third-party dynamic libraries
        run: |
          set -euo pipefail
          dir="native-cpp/prebuilt/${{ matrix.platform }}"
          bins=("$dir/frontend" "$dir/etsc")
          [ -x "$dir/compiler/etsc" ] && bins+=("$dir/compiler/etsc")
          for bin in "${bins[@]}"; do
            if [ "$RUNNER_OS" = Linux ]; then
              file "$bin"
              file "$bin" | grep -q 'statically linked' || { echo "::error::$bin is not statically linked"; exit 1; }
            else
              otool -L "$bin"
              # Only the OS libraries every macOS ships may remain.
              extra="$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -v -E '^/usr/lib/(libSystem\.B|libc\+\+\.1)\.dylib$' || true)"
              if [ -n "$extra" ]; then echo "::error::$bin links $extra"; exit 1; fi
            fi
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          dir="native-cpp/prebuilt/${{ matrix.platform }}"
          "$dir/etsc" --version
          "$dir/frontend" examples/hello.ets > "$RUNNER_TEMP/hello.ir.json"
          test -s "$RUNNER_TEMP/hello.ir.json"
          # build-all.sh must now pick the precompiled seed (inputs match).
          bash native-cpp/build-all.sh --out "$RUNNER_TEMP/picked/native" 2>&1 | tee "$RUNNER_TEMP/picked.log"
          grep -q 'Semilla precompilada' "$RUNNER_TEMP/picked.log"
          if [ "$RUNNER_OS" = Linux ]; then
            # Same layout as the seed: <dir>/native/{etsc,frontend}.
            ESTC_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/picked/native/etsc" build examples/hello.ets \
              -o "$RUNNER_TEMP/hello.cpp" --binary "$RUNNER_TEMP/hello" --no-progress
            "$RUNNER_TEMP/hello" | grep -q 'Hola, mundo'
          fi
          if [ -x "$dir/compiler/etsc" ]; then
            "$dir/compiler/etsc" --version
            # build-compiler.sh must now pick the precompiled compiler.
            bash native-cpp/build-compiler.sh --seed "$RUNNER_TEMP/seed" --out "$RUNNER_TEMP/picked-compiler" 2>&1 | tee "$RUNNER_TEMP/picked-compiler.log"
            grep -q 'Compilador precompilado' "$RUNNER_TEMP/picked-compiler.log"
            if [ "$RUNNER_OS" = Linux ]; then
              ESTC_ROOT="$GITHUB_WORKSPACE" "$dir/compiler/etsc" build examples/hello.ets \
                --binary "$RUNNER_TEMP/hello2" --no-progress
              "$RUNNER_TEMP/hello2" | grep -q 'Hola, mundo'
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.platform }}
          path: native-cpp/prebuilt/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/download-artifact@v4
        with:
          pattern: seed-*
          path: ${{ runner.temp }}/seeds
      - name: Commit precompiled seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP"/seeds/seed-*; do
            platform="${d##*/seed-}"
            mkdir -p "native-cpp/prebuilt/$platform"
            cp -R "$d"/. "native-cpp/prebuilt/$platform/"
            chmod +x "native-cpp/prebuilt/$platform/frontend" "native-cpp/prebuilt/$platform/etsc"
            [ -f "native-cpp/prebuilt/$platform/compiler/etsc" ] && chmod +x "native-cpp/prebuilt/$platform/compiler/etsc"
          done
          (cd native-cpp && find . -type f -not -path './native/*' | LC_ALL=C sort > files.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A native-cpp/prebuilt native-cpp/files.txt
          if git diff --cached --quiet; then echo 'Seeds unchanged.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m "build(native-cpp): semillas y compiladores precompilados para ${GITHUB_SHA::7}"
          # main puede avanzar mientras se compila (p. ej. el commit de versión de
          # auto-version.yml): se rebasa y se reintenta. Solo cambian prebuilt/ y
          # files.txt, así que el rebase no choca con commits ajenos.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main avanzó; reintento $attempt"
            sleep $((attempt * 5))
            git fetch --depth=50 origin main
            git rebase origin/main
          done
          branch="build/seed-prebuilt-${{ github.run_id }}"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" \
            --title "build(native-cpp): semillas y compiladores precompilados" \
            --body "Linux x86_64 y macOS arm64, enlace autocontenido, generadas por seed-prebuilt.yml." \
            || echo "::warning::Rama $branch subida; crea la PR a mano."
