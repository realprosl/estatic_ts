name: Seed and compiler prebuilt (Linux + macOS)

# Compila en cada plataforma, con enlace autocontenido:
#   - la semilla C++ (native-cpp/build-all.sh --update-prebuilt) y
#   - el compilador de compiler/ (native-cpp/build-compiler.sh --update-prebuilt),
# comprueba que no dependen de librerías dinámicas de terceros, los prueba y,
# en main, los publica en la rama `prebuilt` (un único commit, force-push; nunca
# se fusiona con main) con la huella de sus fuentes. install.sh la descarga con
# native-cpp/fetch-prebuilt.sh y solo los usa si esa huella coincide.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - native-cpp/compiler/**
      - native-cpp/build-all.sh
      - compiler/**
      - native-cpp/build-compiler.sh
      - src/codegen/ir/native/**
      - runtime/**
      - .github/workflows/seed-prebuilt.yml
  push:
    branches: [main]
    paths:
      - native-cpp/compiler/**
      - native-cpp/build-all.sh
      - compiler/**
      - native-cpp/build-compiler.sh
      - src/codegen/ir/native/**
      - runtime/**
      - .github/workflows/seed-prebuilt.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seed-prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install static build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y g++ libssl-dev
          test -f /usr/lib/x86_64-linux-gnu/libcrypto.a

      - name: Install static build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.a"

      - name: Build self-contained seed
        run: bash native-cpp/build-all.sh --update-prebuilt --out "$RUNNER_TEMP/seed"

      - name: Build self-contained bootstrap compiler
        id: compiler
        # macOS: el runtime aún no está portado del todo; si falla, se publica
        # solo la semilla y install.sh compila el compilador allí.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: bash native-cpp/build-compiler.sh --seed "$RUNNER_TEMP/seed" --out "$RUNNER_TEMP/compiler/etsc" --update-prebuilt

      - name: Verify no third-party dynamic libraries
        run: |
          set -euo pipefail
          dir="native-cpp/prebuilt/${{ matrix.platform }}"
          bins=("$dir/etsc")
          [ -x "$dir/compiler/etsc" ] && bins+=("$dir/compiler/etsc")
          for bin in "${bins[@]}"; do
            if [ "$RUNNER_OS" = Linux ]; then
              file "$bin"
              file "$bin" | grep -q 'statically linked' || { echo "::error::$bin is not statically linked"; exit 1; }
            else
              otool -L "$bin"
              # Only the OS libraries every macOS ships may remain.
              extra="$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -v -E '^/usr/lib/(libSystem\.B|libc\+\+\.1)\.dylib$' || true)"
              if [ -n "$extra" ]; then echo "::error::$bin links $extra"; exit 1; fi
            fi
          done

      - name: Smoke test
        run: |
          set -euo pipefail
          dir="native-cpp/prebuilt/${{ matrix.platform }}"
          "$dir/etsc" --version
          ESTC_ROOT="$GITHUB_WORKSPACE" "$dir/etsc" examples/hello.ets --check --emit-ir "$RUNNER_TEMP/hello.ir.json" --no-progress
          test -s "$RUNNER_TEMP/hello.ir.json"
          # build-all.sh must now pick the precompiled seed (inputs match).
          bash native-cpp/build-all.sh --out "$RUNNER_TEMP/picked/native" 2>&1 | tee "$RUNNER_TEMP/picked.log"
          grep -q 'Semilla precompilada' "$RUNNER_TEMP/picked.log"
          if [ "$RUNNER_OS" = Linux ]; then
            ESTC_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/picked/native/etsc" build examples/hello.ets \
              -o "$RUNNER_TEMP/hello.cpp" --binary "$RUNNER_TEMP/hello" --no-progress
            "$RUNNER_TEMP/hello" | grep -q 'Hola, mundo'
          fi
          if [ -x "$dir/compiler/etsc" ]; then
            "$dir/compiler/etsc" --version
            # build-compiler.sh must now pick the precompiled compiler.
            bash native-cpp/build-compiler.sh --seed "$RUNNER_TEMP/seed" --out "$RUNNER_TEMP/picked-compiler" 2>&1 | tee "$RUNNER_TEMP/picked-compiler.log"
            grep -q 'Compilador precompilado' "$RUNNER_TEMP/picked-compiler.log"
            if [ "$RUNNER_OS" = Linux ]; then
              ESTC_ROOT="$GITHUB_WORKSPACE" "$dir/compiler/etsc" build examples/hello.ets \
                --binary "$RUNNER_TEMP/hello2" --no-progress
              "$RUNNER_TEMP/hello2" | grep -q 'Hola, mundo'
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.platform }}
          path: native-cpp/prebuilt/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Los binarios NO van a main: se publican en la rama `prebuilt`, que se
    # sobrescribe con un único commit (force-push) para no acumular historial.
    # native-cpp/fetch-prebuilt.sh la descarga con --depth 1.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: seed-*
          path: ${{ runner.temp }}/seeds
      - name: Publish to the prebuilt branch (single commit, force-push)
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/prebuilt-tree"
          mkdir -p "$tree"
          # Conserva las plataformas que esta ejecución no haya producido.
          if git fetch --depth 1 origin refs/heads/prebuilt 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$tree"
          fi
          for d in "$RUNNER_TEMP"/seeds/seed-*; do
            platform="${d##*/seed-}"
            rm -rf "$tree/$platform"
            mkdir -p "$tree/$platform"
            cp -R "$d"/. "$tree/$platform/"
          done
          rm -f "$tree/README.md"
          {
            echo "# Precompilados de etsc"
            echo
            echo "Rama generada por \`seed-prebuilt.yml\` desde main@${GITHUB_SHA::7}."
            echo "No se fusiona con main: se sobrescribe con un único commit en cada actualización."
            echo "\`native-cpp/fetch-prebuilt.sh\` (llamado por \`install.sh\`) la descarga."
            echo
            for p in "$tree"/*/; do p="$(basename "$p")"; echo "- \`$p\`: $(ls "$tree/$p" | tr '\n' ' ')"; done
          } > "$tree/README.md"
          find "$tree" -type f -name etsc -exec chmod +x {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan prebuilt-publish
          git rm -rfq --cached .
          git clean -fdxq
          cp -R "$tree"/. .
          git add -A .
          git commit -q -m "prebuilt: semilla y compilador para main@${GITHUB_SHA::7}"
          git push --force origin HEAD:refs/heads/prebuilt
          echo "Rama prebuilt actualizada para main@${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
