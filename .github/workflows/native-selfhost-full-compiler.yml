name: Native self-hosting — compilador funcional completo

on:
  workflow_dispatch:
  push:
    branches: [feature/native-self-hosting]
    paths:
      - 'native-compiler-mini/**'
      - '.github/workflows/native-selfhost-full-compiler.yml'

permissions:
  contents: read

jobs:
  compiler-completo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias C++ nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Construir compilador completo desde el snapshot C++ sin Node
        run: |
          set -euo pipefail
          cd native-compiler-mini
          bash build-all.sh
          test -x native/frontend
          test -x native/etsc
          ./native/etsc --version
      - name: Compilar un programa real con el compilador nativo
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p "$GITHUB_WORKSPACE/build/selfhost"
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/examples/hello.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/hello.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/hello" --no-progress
          test -s build/selfhost/hello.cpp
          test -x build/selfhost/hello
          build/selfhost/hello
      - name: Comprobar compilación nativa del frontend completo de Bootstrap
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/bootstrap-ir.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/bootstrap-ir" --no-progress
          test -s build/selfhost/bootstrap-ir.cpp
          test -x build/selfhost/bootstrap-ir
          echo 'Frontend Bootstrap recompilado; esto NO certifica todavía la reproducción del driver/backend etsc.' >> "$GITHUB_STEP_SUMMARY"
      - name: Integrar frontend recompilado con driver y backend C++ nativos
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p build/selfhost/stage2
          # Se reutilizan el driver y el backend C++ de la referencia; el frontend
          # procede de la recompilación nativa de Bootstrap, no del snapshot.
          cp "$ESTC_ROOT/native/etsc" build/selfhost/stage2/etsc
          cp build/selfhost/bootstrap-ir build/selfhost/stage2/frontend
          test -x build/selfhost/stage2/etsc
          test -x build/selfhost/stage2/frontend
          build/selfhost/stage2/etsc build examples/hello.ets \
            --frontend "$GITHUB_WORKSPACE/build/selfhost/stage2/frontend" \
            -o "$GITHUB_WORKSPACE/build/selfhost/stage2/hello.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/stage2/hello" --no-progress
          test -x build/selfhost/stage2/hello
          build/selfhost/stage2/hello
      - name: Construir frontend instrumentado para localizar fase lenta
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p build/selfhost/trace
          python3 - <<'PY'
          from pathlib import Path
          source=Path('bootstrap/ir/demo.ets').read_text()
          replacements=[
            ('const graph = loader.load(entry); const project = analyzeProject(graph);',
             'printError("TRACE BEGIN loader.load"); const graph = loader.load(entry); printError("TRACE END loader.load / BEGIN analyzeProject"); const project = analyzeProject(graph); printError("TRACE END analyzeProject");'),
            ('let ir = lowerProject(project.graph,project.binding,project.checked);',
             'printError("TRACE BEGIN lowerProject"); let ir = lowerProject(project.graph,project.binding,project.checked); printError("TRACE END lowerProject");'),
            ('print(formatIr(ir)); if (!ir.success)',
             'printError("TRACE BEGIN formatIr"); print(formatIr(ir)); printError("TRACE END formatIr"); if (!ir.success)')
          ]
          for old,new in replacements:
              if source.count(old)!=1: raise SystemExit(f'Instrumentation anchor not unique: {old}')
              source=source.replace(old,new)
          # Keep relative imports working: instrument a temporary copy alongside demo.ets.
          Path('bootstrap/ir/demo-trace.ets').write_text(source)
          PY
          trap 'rm -f bootstrap/ir/demo-trace.ets' EXIT
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/bootstrap/ir/demo-trace.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/trace/frontend.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/trace/frontend" --no-progress
          test -x build/selfhost/trace/frontend
      - name: Perfilar fases del frontend recompilado
        timeout-minutes: 7
        run: |
          set -euo pipefail
          echo "Inicio: $(date -u +%FT%TZ)"
          /usr/bin/time -v -o build/selfhost/trace/time.txt \
            timeout --signal=TERM --kill-after=15s 5m \
            build/selfhost/trace/frontend "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            > build/selfhost/trace/ir.json 2> build/selfhost/trace/stderr.log || {
              rc=$?
              echo "::error::Frontend instrumentado terminó con código $rc"
              cat build/selfhost/trace/stderr.log || true
              cat build/selfhost/trace/time.txt || true
              exit "$rc"
            }
          grep 'TRACE ' build/selfhost/trace/stderr.log || true
          cat build/selfhost/trace/time.txt
      - name: Diagnóstico segunda generación — análisis y emisión de IR
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p build/selfhost/stage2
          echo "::group::Frontend Bootstrap de segunda generación"
          date -u '+Inicio frontend: %FT%TZ'
          /usr/bin/time -v -o build/selfhost/stage2/frontend-time.txt \
            timeout --signal=TERM --kill-after=15s 9m \
            build/selfhost/stage2/frontend "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            > build/selfhost/stage2/bootstrap-ir.json \
            2> build/selfhost/stage2/frontend-stderr.log || {
              rc=$?
              echo "::error::Frontend de segunda generación falló o agotó 9 minutos (exit=$rc)"
              tail -c 4000 build/selfhost/stage2/frontend-stderr.log || true
              cat build/selfhost/stage2/frontend-time.txt || true
              exit "$rc"
            }
          test -s build/selfhost/stage2/bootstrap-ir.json
          python3 - <<'PY'
          import json
          with open('build/selfhost/stage2/bootstrap-ir.json') as f:
              project=json.load(f)
          print('IR success:',project.get('success'))
          print('Diagnósticos:',len(project.get('diagnostics',[])))
          if project.get('success') is not True: raise SystemExit('Frontend no produjo IR válido')
          PY
          cat build/selfhost/stage2/frontend-time.txt
          echo "::endgroup::"
      - name: Diagnóstico segunda generación — codegen C++ y enlace
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          echo "::group::Backend segunda generación"
          date -u '+Inicio backend: %FT%TZ'
          /usr/bin/time -v -o build/selfhost/stage2/backend-time.txt \
            timeout --signal=TERM --kill-after=15s 12m \
            build/selfhost/stage2/etsc build \
            --from-ir "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir.json" \
            -o "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir" \
            --no-progress --verbose || {
              rc=$?
              echo "::error::Backend de segunda generación falló o agotó 12 minutos (exit=$rc)"
              cat build/selfhost/stage2/backend-time.txt || true
              exit "$rc"
            }
          test -x build/selfhost/stage2/bootstrap-ir
          cat build/selfhost/stage2/backend-time.txt
          echo 'Segunda generación del frontend completada. Driver/backend siguen siendo C++ de referencia.' >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
      - name: Guardar artefactos para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selfhost-first-baseline
          path: build/selfhost/
          if-no-files-found: warn
