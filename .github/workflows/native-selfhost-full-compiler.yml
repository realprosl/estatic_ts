name: Native self-hosting — compilador funcional completo

on:
  workflow_dispatch:
  push:
    branches: [feature/native-self-hosting]
    paths:
      - 'native-compiler-mini/**'
      - '.github/workflows/native-selfhost-full-compiler.yml'

permissions:
  contents: read

jobs:
  compiler-completo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias C++ nativas
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Construir compilador completo desde el snapshot C++ sin Node
        run: |
          set -euo pipefail
          cd native-compiler-mini
          bash build-all.sh
          test -x native/frontend
          test -x native/etsc
          ./native/etsc --version
      - name: Compilar un programa real con el compilador nativo
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p "$GITHUB_WORKSPACE/build/selfhost"
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/examples/hello.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/hello.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/hello" --no-progress
          test -s build/selfhost/hello.cpp
          test -x build/selfhost/hello
          build/selfhost/hello
      - name: Comprobar compilación nativa del frontend completo de Bootstrap
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/bootstrap-ir.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/bootstrap-ir" --no-progress
          test -s build/selfhost/bootstrap-ir.cpp
          test -x build/selfhost/bootstrap-ir
          echo 'Frontend Bootstrap recompilado; esto NO certifica todavía la reproducción del driver/backend etsc.' >> "$GITHUB_STEP_SUMMARY"
      - name: Integrar frontend recompilado con driver y backend C++ nativos
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p build/selfhost/stage2
          # Se reutilizan el driver y el backend C++ de la referencia; el frontend
          # procede de la recompilación nativa de Bootstrap, no del snapshot.
          cp "$ESTC_ROOT/native/etsc" build/selfhost/stage2/etsc
          cp build/selfhost/bootstrap-ir build/selfhost/stage2/frontend
          test -x build/selfhost/stage2/etsc
          test -x build/selfhost/stage2/frontend
          build/selfhost/stage2/etsc build examples/hello.ets \
            --frontend "$GITHUB_WORKSPACE/build/selfhost/stage2/frontend" \
            -o "$GITHUB_WORKSPACE/build/selfhost/stage2/hello.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/stage2/hello" --no-progress
          test -x build/selfhost/stage2/hello
          build/selfhost/stage2/hello
      - name: Medir constructor Parser aislado por tamaño de tokens
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p build/selfhost/constructor-bench
          cat > bootstrap/ir/constructor-bench.ets <<'ETS'
          import { tokenizeExpanded } from "../lexer/lexer";
          import { Parser, ParserToken } from "../parser/parser";
          import { readSnapshot } from "../modules/platform";
          function run(): void {
            const snapshot: string[] = readSnapshot(argument(1));
            if (snapshot[1] != "") { printError(snapshot[1]); exitProcess(2); }
            const lexical = tokenizeExpanded(snapshot[0]);
            let tokens: ParserToken[] = [];
            for (const token of lexical.tokens) {
              tokens.push(new ParserToken(token.kind, token.lexeme, token.offset, token.line, token.column,
                token.endOffset, token.endLine, token.endColumn));
            }
            const limit: number = Number(argument(2));
            let sample: ParserToken[] = [];
            let count: number = 0;
            for (const token of tokens) {
              if (count >= limit || token.kind == "eof") break;
              sample.push(token);
              count = count + 1;
            }
            const last: ParserToken = sample[sample.length - 1];
            sample.push(new ParserToken("eof", "", last.endOffset, last.endLine, last.endColumn,
              last.endOffset, last.endLine, last.endColumn));
            printError("BENCH constructor BEGIN tokens=" + numberToString(sample.length));
            const parser: Parser = new Parser(sample);
            printError("BENCH constructor END tokens=" + numberToString(parser.tokens.length)
              + " diagnostics=" + numberToString(parser.diagnostics.length));
          }
          run();
          ETS
          trap 'rm -f bootstrap/ir/constructor-bench.ets' EXIT
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/bootstrap/ir/constructor-bench.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/constructor-bench/bench.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/constructor-bench/bench" --no-progress
          for n in 1000 2000 4000 8000 16000 20208; do
            echo "::group::Constructor con $n tokens"
            /usr/bin/time -f 'BENCH elapsed=%e user=%U max_rss_kb=%M' \
              timeout --signal=TERM --kill-after=5s 40s \
              build/selfhost/constructor-bench/bench "$GITHUB_WORKSPACE/bootstrap/parser/parser.ets" "$n" \
              2>&1 | tee "build/selfhost/constructor-bench/tokens-$n.log"
            echo "::endgroup::"
          done
      - name: Construir frontend instrumentado para localizar fase lenta
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          mkdir -p build/selfhost/trace
          python3 - <<'PY'
          from pathlib import Path
          source=Path('bootstrap/ir/demo.ets').read_text()
          replacements=[
            ('const graph = loader.load(entry); const project = analyzeProject(graph);',
             'printError("TRACE BEGIN loader.load"); const graph = loader.load(entry); printError("TRACE END loader.load / BEGIN analyzeProject"); const project = analyzeProject(graph); printError("TRACE END analyzeProject");'),
            ('let ir = lowerProject(project.graph,project.binding,project.checked);',
             'printError("TRACE BEGIN lowerProject"); let ir = lowerProject(project.graph,project.binding,project.checked); printError("TRACE END lowerProject");'),
            ('print(formatIr(ir)); if (!ir.success)',
             'printError("TRACE BEGIN formatIr"); print(formatIr(ir)); printError("TRACE END formatIr"); if (!ir.success)')
          ]
          loader=Path('bootstrap/modules/loader.ets').read_text()
          loader_replacements=[
            ('const cached: CachedSource = cache.getOrParseModule(file, source, after);',
             'printError("TRACE parse BEGIN " + file + " bytes=" + numberToString(source.length)); const cached: CachedSource = cache.getOrParseModule(file, source, after); printError("TRACE parse END " + file);'),
            ('let discovered: LoadedFile[] = [readModule(canonical, graph, cache)];',
             'printError("TRACE first module BEGIN " + canonical); let discovered: LoadedFile[] = [readModule(canonical, graph, cache)]; printError("TRACE first module END " + canonical);'),
            ('if (existing < 0) { discovered.push(readModule(dependency, graph, cache));',
             'if (existing < 0) { printError("TRACE dependency BEGIN " + dependency); discovered.push(readModule(dependency, graph, cache)); printError("TRACE dependency END " + dependency);')
          ]
          for old,new in loader_replacements:
              if loader.count(old)!=1: raise SystemExit(f'Loader instrumentation anchor not unique: {old}')
              loader=loader.replace(old,new)
          frontend=Path('bootstrap/frontend/frontend.ets').read_text()
          frontend_replacements=[
            ('const lexical: LexerResult = tokenizeExpanded(source);',
             'printError("TRACE lexer BEGIN " + file); const lexical: LexerResult = tokenizeExpanded(source); printError("TRACE lexer END " + file + " tokens=" + numberToString(lexical.tokens.length));'),
            ('ast = parseTokens(tokens);',
             'printError("TRACE parser BEGIN " + file + " tokens=" + numberToString(tokens.length)); ast = parseTokens(tokens); printError("TRACE parser END " + file + " nodes=" + numberToString(ast.nodes.length));')
          ]
          for old,new in frontend_replacements:
              if frontend.count(old)!=1: raise SystemExit(f'Frontend instrumentation anchor not unique: {old}')
              frontend=frontend.replace(old,new)
          Path('bootstrap/frontend/frontend-trace-backup.ets').write_text(Path('bootstrap/frontend/frontend.ets').read_text())
          Path('bootstrap/frontend/frontend.ets').write_text(frontend)
          cache=Path('bootstrap/modules/syntax-cache.ets').read_text()
          cache_replacements=[
            ('const hash: string = contentHash(source);',
             'printError("TRACE cache hash BEGIN " + file); const hash: string = contentHash(source); printError("TRACE cache hash END " + file);'),
            ('const result: SourceResult = parseSource(source, file);',
             'printError("TRACE cache miss parseSource BEGIN " + file); const result: SourceResult = parseSource(source, file); printError("TRACE cache miss parseSource END " + file);'),
            ('result.success ? encodeSyntax(result) : ""',
             'result.success ? encodeSyntax(result) : ""')
          ]
          for old,new in cache_replacements:
              if cache.count(old)!=1: raise SystemExit(f'Cache instrumentation anchor not unique: {old}')
              cache=cache.replace(old,new)
          Path('bootstrap/modules/syntax-cache-trace-backup.ets').write_text(Path('bootstrap/modules/syntax-cache.ets').read_text())
          Path('bootstrap/modules/syntax-cache.ets').write_text(cache)
          parser=Path('bootstrap/parser/parser.ets').read_text()
          parser_replacements=[
            ('  constructor(tokens: ParserToken[]) {',
             '  constructor(tokens: ParserToken[]) { printError("TRACE constructor ENTER tokens=" + numberToString(tokens.length));'),
            ('    for (let i: number = 0; i + 1 < this.tokens.length; i = i + 1) {',
             '    printError("TRACE constructor EOF scan BEGIN"); for (let i: number = 0; i + 1 < this.tokens.length; i = i + 1) { if (i % 1000 == 0) printError("TRACE constructor EOF scan at=" + numberToString(i));'),
            ('    for (let i: number = 0; i < this.tokens.length; i = i + 1) {',
             '    printError("TRACE constructor coordinate scan BEGIN"); for (let i: number = 0; i < this.tokens.length; i = i + 1) { if (i % 1000 == 0) printError("TRACE constructor coordinate scan at=" + numberToString(i));'),
            ('  parseProgram(): ParseResult {',
             '  parseProgram(): ParseResult { printError("TRACE parseProgram ENTER tokens=" + numberToString(this.tokens.length));'),
            ('    this.skipNewlines();\n    if (this.headerAhead()) {',
             '    printError("TRACE program initial newlines BEGIN at=" + numberToString(this.current)); this.skipNewlines(); printError("TRACE program initial newlines END at=" + numberToString(this.current));\n    printError("TRACE program headerAhead BEGIN at=" + numberToString(this.current)); if (this.headerAhead()) { printError("TRACE program headerAhead TRUE");'),
            ('      while (this.headerAhead()) {',
             '      while (this.headerAhead()) { printError("TRACE program decorator BEGIN at=" + numberToString(this.current));'),
            ('        this.skipNewlines();\n      }\n      this.edge(program, EdgeRole.Statements, header);',
             '        this.skipNewlines(); printError("TRACE program decorator END at=" + numberToString(this.current));\n      }\n      this.edge(program, EdgeRole.Statements, header);'),
            ('    while (!this.check("eof")) {\n      this.skipNewlines();',
             '    printError("TRACE program statements BEGIN at=" + numberToString(this.current)); while (!this.check("eof")) {\n      printError("TRACE program loop BEGIN at=" + numberToString(this.current)); this.skipNewlines();'),
            ('        const child: number = this.statement(true);',
             '        printError("TRACE statement BEGIN at=" + numberToString(this.current) + " kind=" + this.peek(0).kind + " lexeme=" + this.peek(0).lexeme); const child: number = this.statement(true); printError("TRACE statement END at=" + numberToString(this.current) + " nodes=" + numberToString(this.nodes.length));'),
            ('    return new ParseResult(program, this.nodes, this.diagnostics);',
             '    printError("TRACE parseProgram DONE at=" + numberToString(this.current)); return new ParseResult(program, this.nodes, this.diagnostics);')
          ]
          for old,new in parser_replacements:
              if parser.count(old)!=1 and not (old.startswith('    while (!this.check("eof")) {') and parser.count(old)>1): raise SystemExit(f'Parser instrumentation anchor not unique: {old}')
              parser=parser.replace(old,new,1) if old.startswith('    while (!this.check("eof")) {') else parser.replace(old,new)
          Path('bootstrap/parser/parser-trace-backup.ets').write_text(Path('bootstrap/parser/parser.ets').read_text())
          Path('bootstrap/parser/parser.ets').write_text(parser)
          Path('bootstrap/modules/loader-trace-backup.ets').write_text(Path('bootstrap/modules/loader.ets').read_text())
          Path('bootstrap/modules/loader.ets').write_text(loader)
          for old,new in replacements:
              if source.count(old)!=1: raise SystemExit(f'Instrumentation anchor not unique: {old}')
              source=source.replace(old,new)
          # Keep relative imports working: instrument a temporary copy alongside demo.ets.
          Path('bootstrap/ir/demo-trace.ets').write_text(source)
          PY
          trap 'mv bootstrap/modules/loader-trace-backup.ets bootstrap/modules/loader.ets; mv bootstrap/modules/syntax-cache-trace-backup.ets bootstrap/modules/syntax-cache.ets; mv bootstrap/frontend/frontend-trace-backup.ets bootstrap/frontend/frontend.ets; mv bootstrap/parser/parser-trace-backup.ets bootstrap/parser/parser.ets; rm -f bootstrap/ir/demo-trace.ets' EXIT
          "$ESTC_ROOT/native/etsc" build "$GITHUB_WORKSPACE/bootstrap/ir/demo-trace.ets" \
            -o "$GITHUB_WORKSPACE/build/selfhost/trace/frontend.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/trace/frontend" --no-progress
          test -x build/selfhost/trace/frontend
      - name: Diagnóstico driver verbose con frontend recompilado
        timeout-minutes: 2
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          timeout 60s build/selfhost/stage2/etsc build examples/hello.ets \
            --frontend "$GITHUB_WORKSPACE/build/selfhost/stage2/frontend" \
            -o "$GITHUB_WORKSPACE/build/selfhost/stage2/hello-verbose.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/stage2/hello-verbose" \
            --verbose --no-progress
      - name: Perfilar fases del frontend recompilado
        timeout-minutes: 7
        run: |
          set -euo pipefail
          echo "Inicio: $(date -u +%FT%TZ)"
          /usr/bin/time -v -o build/selfhost/trace/time.txt \
            timeout --signal=TERM --kill-after=15s 5m \
            build/selfhost/trace/frontend "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            > build/selfhost/trace/ir.json 2> build/selfhost/trace/stderr.log || {
              rc=$?
              echo "::error::Frontend instrumentado terminó con código $rc"
              cat build/selfhost/trace/stderr.log || true
              cat build/selfhost/trace/time.txt || true
              exit "$rc"
            }
          grep 'TRACE ' build/selfhost/trace/stderr.log || true
          cat build/selfhost/trace/time.txt
      - name: Diagnóstico segunda generación — análisis y emisión de IR
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p build/selfhost/stage2
          echo "::group::Frontend Bootstrap de segunda generación"
          date -u '+Inicio frontend: %FT%TZ'
          /usr/bin/time -v -o build/selfhost/stage2/frontend-time.txt \
            timeout --signal=TERM --kill-after=15s 9m \
            build/selfhost/stage2/frontend "$GITHUB_WORKSPACE/bootstrap/ir/demo.ets" \
            > build/selfhost/stage2/bootstrap-ir.json \
            2> build/selfhost/stage2/frontend-stderr.log || {
              rc=$?
              echo "::error::Frontend de segunda generación falló o agotó 9 minutos (exit=$rc)"
              tail -c 4000 build/selfhost/stage2/frontend-stderr.log || true
              cat build/selfhost/stage2/frontend-time.txt || true
              exit "$rc"
            }
          test -s build/selfhost/stage2/bootstrap-ir.json
          python3 - <<'PY'
          import json
          with open('build/selfhost/stage2/bootstrap-ir.json') as f:
              project=json.load(f)
          print('IR success:',project.get('success'))
          print('Diagnósticos:',len(project.get('diagnostics',[])))
          if project.get('success') is not True: raise SystemExit('Frontend no produjo IR válido')
          PY
          cat build/selfhost/stage2/frontend-time.txt
          echo "::endgroup::"
      - name: Diagnóstico segunda generación — codegen C++ y enlace
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/native-compiler-mini"
          echo "::group::Backend segunda generación"
          date -u '+Inicio backend: %FT%TZ'
          /usr/bin/time -v -o build/selfhost/stage2/backend-time.txt \
            timeout --signal=TERM --kill-after=15s 12m \
            build/selfhost/stage2/etsc build \
            --from-ir "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir.json" \
            -o "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir.cpp" \
            --binary "$GITHUB_WORKSPACE/build/selfhost/stage2/bootstrap-ir" \
            --no-progress --verbose || {
              rc=$?
              echo "::error::Backend de segunda generación falló o agotó 12 minutos (exit=$rc)"
              cat build/selfhost/stage2/backend-time.txt || true
              exit "$rc"
            }
          test -x build/selfhost/stage2/bootstrap-ir
          cat build/selfhost/stage2/backend-time.txt
          echo 'Segunda generación del frontend completada. Driver/backend siguen siendo C++ de referencia.' >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"
      - name: Guardar artefactos para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selfhost-first-baseline
          path: build/selfhost/
          if-no-files-found: warn
