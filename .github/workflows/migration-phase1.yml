name: Migration phase 1 regression
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'bootstrap/**'
      - 'runtime/**'
      - 'shared/**'
      - 'src/codegen/ir/**'
      - 'src/config/**'
      - 'src/project/**'
      - 'scripts/check-runtime-boundaries.sh'
      - '.github/workflows/migration-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Runtime and IR boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify dependency direction
        run: bash scripts/check-runtime-boundaries.sh
      - name: Verify old/new runtime and IR entrypoints
        run: |
          node --experimental-strip-types --input-type=module -e '
            import * as oldRuntime from "./bootstrap/build/runtime-cache.ts";
            import * as runtime from "./runtime/build/runtime-cache.ts";
            import * as oldIr from "./src/codegen/ir/model.ts";
            import * as oldBackend from "./src/codegen/ir/cpp-generator.ts";
            import * as backend from "./backend/ir/cpp-generator.ts";
            import * as ir from "./shared/ir/model.ts";
            for (const name of ["runtimeArchive", "runtimeFlags", "precompileRuntime"]) {
              if (oldRuntime[name] !== runtime[name]) throw new Error("Runtime facade mismatch: " + name);
            }
            if (oldBackend.IrCppGenerator !== backend.IrCppGenerator || oldBackend.generateCppFromIr !== backend.generateCppFromIr) throw new Error("Backend facade mismatch");
            if (oldIr.IrCodegenError !== ir.IrCodegenError) throw new Error("IR facade mismatch");
            if (new ir.IrCodegenError("test").code !== "IR_CPP_UNSUPPORTED") throw new Error("IR diagnostic changed");
          '
      - name: Syntax checks
        run: |
          node --experimental-strip-types --check bootstrap/cli.ts
          node --experimental-strip-types --check bootstrap/ir/cpp.ts
          node --experimental-strip-types --check runtime/build/runtime-cache.ts
          node --experimental-strip-types --check shared/ir/model.ts
          node --experimental-strip-types --check backend/ir/cpp-generator.ts
          node --experimental-strip-types --check backend/ir/runtime-calls.ts

  regression:
    name: Bootstrap and codegen regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install native compilation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libdrogon-dev libtrantor-dev libjsoncpp-dev uuid-dev zlib1g-dev
          test -f /usr/include/uv.h
          test -f /usr/include/drogon/drogon.h
      - name: Compiler versions
        run: |
          node --version
          g++ --version | head -n 1
      - name: IR and native backend tests
        run: |
          node --experimental-strip-types --test --test-concurrency=1 bootstrap/ir/ir.test.ts bootstrap/ir/cpp.test.ts bootstrap/ir/native.test.ts
      - name: CLI and runtime integration tests
        run: |
          node --experimental-strip-types --test --test-concurrency=1 bootstrap/cli.test.ts test/unit/runtime-backends.test.ts test/unit/cpp-types.test.ts test/unit/codegen.test.ts
      - name: Frontend compatibility tests
        run: |
          node --experimental-strip-types --test --test-concurrency=1 bootstrap/lexer/lexer.test.ts bootstrap/parser/parser.test.ts bootstrap/binder/binder.test.ts bootstrap/checker/checker.test.ts
