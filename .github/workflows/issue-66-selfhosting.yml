name: Issue 66 self-hosting verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-66-selfhosting.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 9659aec42bac46d06f11880138f0a73dd6a79ad2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 nodejs
      - name: Rebuild and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/repro66/tmp
          export TMPDIR="$PWD/build/repro66/tmp"
          bash native-compiler-mini/build-all.sh
          node --experimental-strip-types --input-type=module -e 'import {buildLoader} from "./bootstrap/modules/build.ts"; console.log(await buildLoader(process.cwd()+"/build/repro66/seed", "bootstrap/ir/demo.ets", true));'
          g++ -std=c++20 -O1 -pthread -fno-exceptions -I. -Ibuild/repro66/seed build/repro66/seed/unity.cpp -o build/repro66/seed/frontend-O1
          python3 scripts/verify-native-self-generation.py --frontend build/repro66/seed/frontend-O1 --seed-source-commit 9659aec42bac46d06f11880138f0a73dd6a79ad2 --target-source-commit 9659aec42bac46d06f11880138f0a73dd6a79ad2 --compiler native-compiler-mini/native/etsc --native-root native-compiler-mini --output build/repro66/cycle
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-66-selfhosting-evidence
          path: |
            build/repro66/cycle/
          if-no-files-found: warn
          retention-days: 14
