name: Native C++ compiler snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-cpp-bootstrap-snapshot
    paths:
      - .github/workflows/native-cpp-bootstrap.yml
      - scripts/generate-native-cpp-snapshot.mjs
      - bootstrap/**
      - src/**
      - runtime/**

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node for stage-0 generation only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Generate C++ from bootstrap using src stage 0
        run: |
          set -euo pipefail
          rm -rf native-cpp
          node --experimental-strip-types scripts/generate-native-cpp-snapshot.mjs
      - name: Assemble standalone source-only C++ compiler package
        shell: bash
        run: |
          set -euo pipefail
          d=native-cpp
          mkdir -p "$d/src/codegen/ir" "$d/bootstrap/modules"
          cp -a src/codegen/ir/native "$d/src/codegen/ir/"
          cp -a bootstrap/native "$d/bootstrap/"
          find bootstrap/modules -maxdepth 1 -type f \( -name '*.hpp' -o -name '*.h' \) -exec cp {} "$d/bootstrap/modules/" \;
          cp -a runtime "$d/"
          if [ -d templates ]; then cp -a templates "$d/"; fi
          cp -a types "$d/"
          cat > "$d/build-all.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          mkdir -p native
          g++ -std=c++20 -O1 -pthread -fno-exceptions -I. -Ifrontend \
            '-DESTATIC_FRONTEND_ID="portable"' frontend/unity.cpp -o native/frontend
          g++ -std=c++20 -O2 -I. -Ibuild/bootstrap/etsc \
            bootstrap/native/driver.cpp src/codegen/ir/native/generator.cpp \
            -lcrypto -o native/etsc
          SH
          chmod +x "$d/build-all.sh"
          cat > "$d/README.md" <<'MD'
          # native-cpp — compilador Estatic en C++20
          
          Instantánea de fuentes C++ obtenida compilando `bootstrap/ir/demo.ets`
          y sus dependencias mediante el compilador de referencia `src/` (stage 0).
          No contiene fuentes `.ets`, código TypeScript ejecutable ni binarios precompilados.
          
          En Linux, con G++ C++20 y OpenSSL de desarrollo:
          
          ```bash
          bash ./build-all.sh
          export ESTC_ROOT="$(pwd)"
          ./native/etsc build /ruta/proyecto/main.ets --no-progress
          ```
          
          `native/frontend` analiza fuentes Estatic y emite IR verificado.
          `native/etsc` es el driver/backend C++ que genera y compila programas.
          Ambos se reconstruyen exclusivamente desde este directorio.
          Para compilar programas se requieren sus fuentes de entrada, pero no Node.
          
          La Action `native-cpp-bootstrap.yml` genera este árbol, lo empaqueta,
          reconstruye y prueba los ejecutables desde el artefacto descargado,
          y solo entonces publica la instantánea en la rama de trabajo.
          MD
          (cd "$d" && find . -type f | sort > files.txt)
          if find "$d" -type f \( -name '*.ets' -o \( -name '*.ts' ! -name '*.d.ts' \) -o -name '*.o' -o -name '*.a' -o -name '*.so' \) | grep .; then
            echo 'Unexpected source language or precompiled binary in native-cpp' >&2
            exit 1
          fi
      - name: Upload native-cpp source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-compiler-sources
          path: native-cpp/
          if-no-files-found: error
          retention-days: 30
      - name: Download and rebuild compiler only from ZIP contents
        uses: actions/download-artifact@v4
        with:
          name: native-cpp-compiler-sources
          path: package
      - name: Compile standalone frontend and backend
        run: |
          set -euo pipefail
          cd package
          bash ./build-all.sh
          test -x native/frontend
          test -x native/etsc
          ./native/etsc --version
      - name: Test standalone compiler on executable control program
        shell: bash
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/package"
          mkdir -p build/native-cpp-verification
          package/native/etsc build examples/hello.ets \
            -o build/native-cpp-verification/hello.cpp \
            --binary build/native-cpp-verification/hello --no-progress
          test -s build/native-cpp-verification/hello.cpp
          test -x build/native-cpp-verification/hello
          build/native-cpp-verification/hello > build/native-cpp-verification/hello.stdout
          printf 'Hola, mundo\n120\n' > build/native-cpp-verification/hello.expected
          diff -u build/native-cpp-verification/hello.expected build/native-cpp-verification/hello.stdout
      - name: Self-compile seven real bootstrap components using rebuilt C++ compiler
        shell: bash
        run: |
          set -euo pipefail
          export ESTC_ROOT="$GITHUB_WORKSPACE/package"
          mkdir -p build/native-cpp-verification/components
          for component in lexer parser frontend modules binder checker ir; do
            echo "::group::bootstrap/$component"
            package/native/etsc build "bootstrap/$component/demo.ets" \
              -o "build/native-cpp-verification/components/$component.cpp" \
              --binary "build/native-cpp-verification/components/$component" --no-progress
            test -s "build/native-cpp-verification/components/$component.cpp"
            test -x "build/native-cpp-verification/components/$component"
            echo "OK: bootstrap/$component/demo.ets" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
      - name: Commit tested C++ sources to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f native-cpp
          if git diff --cached --quiet; then
            echo 'No generated source changes'
          else
            git commit -m 'build(native-cpp): record verified standalone C++ compiler snapshot'
            git push origin HEAD:feature/native-cpp-bootstrap-snapshot
          fi
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cpp-verification-evidence
          path: build/native-cpp-verification/
          if-no-files-found: warn
          retention-days: 30
