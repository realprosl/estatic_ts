name: Verify native self-generation issue 66 (branch)
on:
  push:
    branches:
      - fix/issue-66-checker-self-generation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tool versions
        run: |
          node --version
          python3 --version
          g++ --version
      - name: Build native reference compiler and frontend seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/repro66/tmp build/repro66/seed
          export TMPDIR="$PWD/build/repro66/tmp"
          bash native-compiler-mini/build-all.sh
          node --experimental-strip-types --input-type=module -e '
          import {buildLoader} from "./bootstrap/modules/build.ts";
          console.log(await buildLoader(process.cwd()+"/build/repro66/seed", "bootstrap/ir/demo.ets", true));'
          g++ -std=c++20 -O1 -pthread -fno-exceptions -I. -Ibuild/repro66/seed build/repro66/seed/unity.cpp -o build/repro66/seed/frontend-O1
      - name: Verify second generation, IR equality and control
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/build/repro66/tmp"
          python3 scripts/verify-native-self-generation.py \
            --frontend build/repro66/seed/frontend-O1 \
            --seed-source-commit "$(git rev-parse HEAD)" \
            --target-source-commit "$(git rev-parse HEAD)" \
            --compiler native-compiler-mini/native/etsc \
            --native-root native-compiler-mini \
            --analysis-timeout 300 --build-timeout 600 \
            --output build/repro66/cycle
      - name: Upload traces and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-generation-issue-66
          path: |
            build/repro66/cycle/**/*.stderr
            build/repro66/cycle/**/*.stdout
            build/repro66/cycle/**/verification.json
            build/repro66/cycle/verification.json
          if-no-files-found: warn
          retention-days: 14
