name: ETS compiler self-hosting
on:
  workflow_dispatch:
  pull_request:
    paths:
      - bootstrap/**
      - native-cpp/**
      - runtime/ets_compiler_host.hpp
      - scripts/analysis-experiments/**
      - scripts/build-ets-compiler.sh
      - scripts/check-ets-compiler.sh
      - scripts/regenerate-ets-native.sh
      - .github/workflows/ets-selfhost.yml
permissions:
  contents: read
jobs:
  selfhost:
    if: github.head_ref != 'perf/analysis-lab' && github.ref_name != 'perf/analysis-lab'
    strategy:
      fail-fast: false
      matrix:
        optimization: [O2]
    name: selfhost-${{ matrix.optimization }}
    env:
      ESTATIC_ETS_OPTIMIZATION: -${{ matrix.optimization }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ time libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Build C++ seed and two ETS generations
        run: bash scripts/build-ets-compiler.sh stage2
      - name: Report build and execution timings
        if: always()
        shell: bash
        run: |
          if test -f build/ets-compiler/timings.tsv; then
            echo '### Self-hosting ${{ matrix.optimization }}' >> "$GITHUB_STEP_SUMMARY"
            echo 'Wall time, CPU time and peak RSS in KiB. Separate runner per profile.' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build/ets-compiler/timings.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report effect edge work
        if: always()
        shell: bash
        run: |
          if test -f build/ets-compiler/stage2-analysis.log; then
            echo '### Effect graph work' >> "$GITHUB_STEP_SUMMARY"
            grep 'effect graph complete,' build/ets-compiler/stage2-analysis.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise ETS backend against IR execution fixtures
        env:
          ESTATIC_IR_BINARY: ${{ github.workspace }}/native-cpp/native/frontend
          ESTATIC_NATIVE_CODEGEN: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
          ESTATIC_NATIVE_BUILD: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
        run: node --experimental-strip-types --test --test-name-pattern='IR C\+\+ (executes|preserves escaped|initializes imported)' bootstrap/ir/cpp.test.ts
      - name: Verify native annotations through the ETS compiler
        env:
          ESTATIC_IR_BINARY: ${{ github.workspace }}/native-cpp/native/frontend
          ESTATIC_NATIVE_COMPILER: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
        run: node --experimental-strip-types --test bootstrap/ir/native-annotations.test.ts
      - name: Verify stage 1
        run: bash scripts/check-ets-compiler.sh build/ets-compiler/etsc
      - name: Verify stage 2
        run: bash scripts/check-ets-compiler.sh build/ets-compiler/etsc-stage2
      - name: Compare compiler IR across generations
        run: cmp build/ets-compiler/stage1.ir.json build/ets-compiler/stage2.ir.json
      - name: Round-trip compiler IR through the streaming reader
        env:
          ESTC_ROOT: ${{ github.workspace }}
        run: |
          build/ets-compiler/etsc-stage2 --from-ir build/ets-compiler/stage2.ir.json --emit-ir build/ets-compiler/roundtrip.ir.json -o build/ets-compiler/from-ir.cpp --no-progress
          cmp build/ets-compiler/stage2.cpp build/ets-compiler/from-ir.cpp
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(readFileSync("build/ets-compiler/stage2.ir.json","utf8")),JSON.parse(readFileSync("build/ets-compiler/roundtrip.ir.json","utf8")));'
      - name: Upload compiler executables and generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-selfhost-${{ matrix.optimization }}
          path: |
            build/ets-compiler/etsc
            build/ets-compiler/etsc-stage2
            build/ets-compiler/*.cpp
            build/ets-compiler/*.json
            build/ets-compiler/timings.tsv
            build/ets-compiler/stage2-analysis.log
          retention-days: 7

  analysis-lab:
    if: github.head_ref == 'perf/analysis-lab' || github.ref_name == 'perf/analysis-lab'
    name: analysis-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [control, summary-fields, module-search, call-metadata, path-prefix, combined]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ time libssl-dev libcurl4-openssl-dev libuv1-dev
      - name: Build and compare baseline and experiment
        run: bash scripts/analysis-experiments/run.sh '${{ matrix.variant }}'
      - name: Report paired measurements
        if: always()
        run: |
          echo '### ${{ matrix.variant }} — paired O2 measurements' >> "$GITHUB_STEP_SUMMARY"
          echo 'Same runner and fixed queue-only input. Baseline runs first; control measures repeat noise. A faster time is accepted only with identical IR and passing checker/smoke tests.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build/analysis-lab/analysis.tsv >> "$GITHUB_STEP_SUMMARY" || true
          grep 'effect graph complete,' build/analysis-lab/*.log >> "$GITHUB_STEP_SUMMARY" || true
          tail -n 12 build/analysis-lab/checker-tests.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ matrix.variant }}
          path: |
            build/analysis-lab/*.tsv
            build/analysis-lab/*.log
            build/analysis-lab/*.stdout
            build/analysis-lab/*.diff
            build/analysis-lab/equivalence.txt
            build/analysis-lab/baseline/timings.tsv
            build/analysis-lab/candidate/timings.tsv
          retention-days: 7
