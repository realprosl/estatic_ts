name: ETS compiler self-hosting
on:
  workflow_dispatch:
  pull_request:
    paths:
      - compiler/**
      - native-cpp/**
      - runtime/**
      - src/codegen/ir/native/**
      - scripts/build-ets-compiler.sh
      - scripts/check-ets-compiler.sh
      - native-cpp/regenerate.sh
      - .github/workflows/ets-selfhost.yml
permissions:
  contents: read
jobs:
  native-copy-regressions:
    name: Native backend copy regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure native dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(g++ libssl-dev libcurl4-openssl-dev libuv1-dev)
          missing=()
          apt_updated=0
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y "${missing[@]}"
            apt_updated=1
          else
            echo 'Native compiler and runtime dependencies already present on runner.'
          fi
      - name: Verify the seed carries no copies of shared C++ sources
        # runtime/, compiler/native/, compiler/modules/, src/codegen/ir/native/ and
        # types/ have a single canonical location; the seed compiles them from there.
        run: |
          for item in runtime compiler src types; do
            if [ -e "native-cpp/$item" ]; then echo "::error::native-cpp/$item must not exist"; exit 1; fi
          done
      - name: Verify aggregate fast paths and value semantics
        run: node --experimental-strip-types --test --test-name-pattern='native aggregate fast paths|temporary argument value semantics|temporary constructor value semantics|length snapshot semantics|length mutation ordering' compiler/ir/native.test.ts
      - name: Verify readonly receivers and malformed IR rejection
        run: node --experimental-strip-types --test --test-concurrency=1 --test-name-pattern='readonly' compiler/checker/checker.test.ts compiler/ir/readonly-verifier.test.ts compiler/ir/native.test.ts
  selfhost:
    needs: native-copy-regressions
    strategy:
      fail-fast: false
      matrix:
        optimization: [O2]
    name: selfhost-${{ matrix.optimization }}
    env:
      ESTATIC_ETS_OPTIMIZATION: -${{ matrix.optimization }}
      ESTATIC_ANALYSIS_JOBS: '2'
      ESTATIC_PROFILE_ANALYSIS: '1'
    runs-on: ubuntu-24.04
    # Includes full sequential/parallel analyses after building two generations.
    # Keep headroom, but diagnose regressions through timings.tsv; increasing
    # this limit alone must not hide lost aggregate-copy optimizations.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Ensure native dependencies and GNU time
        shell: bash
        run: |
          set -euo pipefail
          packages=(g++ time libssl-dev libcurl4-openssl-dev libuv1-dev)
          missing=()
          apt_updated=0
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q '^install ok installed$'; then
              missing+=("$package")
            fi
          done
          if [[ ! -x /usr/bin/time ]]; then missing+=(time); fi
          if ((${#missing[@]})); then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y "${missing[@]}"
            apt_updated=1
          else
            echo 'Native compiler/runtime dependencies and GNU time already present on runner.'
          fi
      - name: Build C++ seed and two ETS generations
        run: bash scripts/build-ets-compiler.sh stage2
      - name: Compare full compiler analysis with one and two workers
        env:
          ESTC_ROOT: ${{ github.workspace }}
        run: |
          /usr/bin/time -o build/ets-compiler/sequential-time.tsv -f 'sequential-analysis\t%e\t%U\t%S\t%M' \
            build/ets-compiler/etsc compiler/driver/main.ets --check --jobs 1 --no-progress \
            --emit-ir build/ets-compiler/sequential.ir.json 2> build/ets-compiler/sequential-analysis.log
          /usr/bin/time -o build/ets-compiler/parallel-time.tsv -f 'parallel-analysis\t%e\t%U\t%S\t%M' \
            build/ets-compiler/etsc compiler/driver/main.ets --check --jobs 2 --no-progress \
            --emit-ir build/ets-compiler/parallel.ir.json 2> build/ets-compiler/parallel-analysis.log
          cmp build/ets-compiler/sequential.ir.json build/ets-compiler/parallel.ir.json
          cmp build/ets-compiler/sequential.ir.json build/ets-compiler/stage2.ir.json
          cat build/ets-compiler/sequential-time.tsv build/ets-compiler/parallel-time.tsv >> build/ets-compiler/timings.tsv
      - name: Repeat paired analysis benchmark
        run: python3 scripts/benchmark-analysis.py --compiler build/ets-compiler/etsc-stage2 --output build/analysis-benchmark --repetitions 3
      - name: Report build and execution timings
        if: always()
        shell: bash
        run: |
          if test -f build/ets-compiler/timings.tsv; then
            echo '### Self-hosting ${{ matrix.optimization }}' >> "$GITHUB_STEP_SUMMARY"
            echo 'Wall time, CPU time and peak RSS in KiB. Separate runner per profile.' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat build/ets-compiler/timings.tsv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report effect edge work
        if: always()
        shell: bash
        run: |
          if test -f build/ets-compiler/stage2-analysis.log; then
            echo '### Effect graph work' >> "$GITHUB_STEP_SUMMARY"
            grep -E 'effect graph complete,|frontend: profile ' build/ets-compiler/stage2-analysis.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise ETS backend against IR execution fixtures
        env:
          ESTATIC_IR_BINARY: ${{ github.workspace }}/scripts/selfhost-ir-frontend.sh
          ESTATIC_SELFHOST_COMPILER: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
          ESTATIC_NATIVE_CODEGEN: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
          ESTATIC_NATIVE_BUILD: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
        run: node --experimental-strip-types --test --test-name-pattern='IR C\+\+ (executes|preserves escaped|initializes imported)' compiler/ir/cpp.test.ts
      - name: Verify native annotations through the ETS compiler
        env:
          ESTATIC_IR_BINARY: ${{ github.workspace }}/scripts/selfhost-ir-frontend.sh
          ESTATIC_SELFHOST_COMPILER: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
          ESTATIC_NATIVE_COMPILER: ${{ github.workspace }}/build/ets-compiler/etsc-stage2
        run: node --experimental-strip-types --test compiler/ir/native-annotations.test.ts
      - name: Verify stage 1
        run: bash scripts/check-ets-compiler.sh build/ets-compiler/etsc
      - name: Verify stage 2 without Node
        run: |
          poison="$RUNNER_TEMP/parallel-without-node"
          mkdir -p "$poison"
          for tool in node nodejs npm; do
            printf '#!/bin/sh\necho forbidden > %s\nexit 99\n' "$RUNNER_TEMP/parallel-node-used" > "$poison/$tool"
            chmod +x "$poison/$tool"
          done
          PATH="$poison:$PATH" bash scripts/check-ets-compiler.sh build/ets-compiler/etsc-stage2
          test ! -e "$RUNNER_TEMP/parallel-node-used"
      - name: Compare compiler IR across generations
        run: cmp build/ets-compiler/stage1.ir.json build/ets-compiler/stage2.ir.json
      - name: Round-trip compiler IR through the streaming reader
        env:
          ESTC_ROOT: ${{ github.workspace }}
        run: |
          build/ets-compiler/etsc-stage2 --from-ir build/ets-compiler/stage2.ir.json --emit-ir build/ets-compiler/roundtrip.ir.json -o build/ets-compiler/from-ir.cpp --no-progress
          cmp build/ets-compiler/stage2.cpp build/ets-compiler/from-ir.cpp
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(readFileSync("build/ets-compiler/stage2.ir.json","utf8")),JSON.parse(readFileSync("build/ets-compiler/roundtrip.ir.json","utf8")));'
      - name: Upload compiler executables and generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-selfhost-${{ matrix.optimization }}
          path: |
            build/ets-compiler/etsc
            build/ets-compiler/etsc-stage2
            build/ets-compiler/*.cpp
            build/ets-compiler/*.json
            build/ets-compiler/timings.tsv
            build/ets-compiler/*analysis.log
            build/analysis-benchmark/
          retention-days: 7
