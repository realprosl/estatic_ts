name: ETS runtime injection proof of concept
on:
  push:
    branches: [experiment/ets-runtime-injection]
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'experiments/runtime-injection/**'
      - '.github/workflows/ets-runtime-injection-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  annotations:
    name: '1 - Native annotations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install libuv development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - run: npm run install:skip-sysdeps
      - run: npm run test:bootstrap:ir:annotations
  imported-runtime:
    name: '2 - Imported ETS runtime'
    needs: annotations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install libuv development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - run: npm run install:skip-sysdeps
      - run: node --experimental-strip-types --test --test-name-pattern='phase 2' experiments/runtime-injection/poc.test.ts
  runtime-extension:
    name: '3 - Runtime extension'
    needs: imported-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install libuv development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - run: npm run install:skip-sysdeps
      - run: node --experimental-strip-types --test experiments/runtime-injection/poc.test.ts
