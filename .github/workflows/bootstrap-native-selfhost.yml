name: Generar fuentes C++ del compilador bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'bootstrap/**'
      - 'runtime/**'
      - '.github/workflows/bootstrap-native-selfhost.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar frontend C++ y tablas nativas
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { compileFile } from './src/modules/module-loader.ts';
          import { nativeTables } from './bootstrap/build/native-tables.ts';
          import { getTs2cppVersionLabel } from './src/core/ts2cpp-version.ts';
          const dir = 'dist/etsc-bootstrap-cpp';
          const out = join(dir, 'frontend');
          mkdirSync(out, { recursive: true });
          const result = await compileFile('bootstrap/ir/demo.ets', { baseDirectory: process.cwd() });
          writeFileSync(join(out, 'estatic_common.hpp'), result.externalHeaders.join('\n')+'\n'+result.header);
          for (const [i, module] of result.modules.entries()) writeFileSync(join(out, `unit-${i}.cpp`), module.cpp);
          const header = result.header.split('\n').filter(x => x.trim() !== '#pragma once').join('\n');
          const bodies = result.modules.map(m => m.cpp.split('\n').filter(x => !x.includes('#include "estatic_common.hpp"')).join('\n'));
          writeFileSync(join(out, 'unity.cpp'), [header, result.externalHeaders.join('\n'), ...bodies].join('\n'));
          const nativeDir = join(dir, 'build/bootstrap/etsc');
          mkdirSync(nativeDir, { recursive: true });
          nativeTables(join(nativeDir, 'native-tables.hpp'));
          writeFileSync(join(nativeDir, 'install_config.hpp'), `#define ESTC_PLATFORM "linux"\n#define ESTC_ARCH "portable"\n#define ESTC_VERSION ${JSON.stringify(getTs2cppVersionLabel().replace(/^estatic/,'etsc'))}\n`);
          console.log(`Generadas ${result.modules.length} unidades frontend C++`);
          NODE
      - name: Copiar dependencias y script de compilación
        run: |
          set -euo pipefail
          d=dist/etsc-bootstrap-cpp
          mkdir -p "$d/src/codegen/ir" "$d/bootstrap"
          cp -a src/codegen/ir/native "$d/src/codegen/ir/"
          cp -a bootstrap/native "$d/bootstrap/"
          mkdir -p "$d/bootstrap/modules"
          find bootstrap/modules -maxdepth 1 -type f \( -name "*.hpp" -o -name "*.h" \) -exec cp {} "$d/bootstrap/modules/" \;
          cp -a runtime "$d/"
          if [ -d templates ]; then cp -a templates "$d/"; fi
          if [ -d types ]; then cp -a types "$d/"; fi
          cat > "$d/build-all.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          mkdir -p native
          g++ -std=c++20 -O0 -pthread -fno-exceptions -I. -Ifrontend \
            '-DESTATIC_FRONTEND_ID="portable"' frontend/unity.cpp -o native/frontend
          g++ -std=c++20 -O2 -I. -Ibuild/bootstrap/etsc \
            bootstrap/native/driver.cpp src/codegen/ir/native/generator.cpp \
            -lcrypto -o native/etsc
          SH
          chmod +x "$d/build-all.sh"
          cat > "$d/README.md" <<'MD'
          # Fuentes C++ del compilador bootstrap
          Este paquete NO contiene binarios precompilados, Node.js ni fuentes TypeScript.
          En Linux, con g++ C++20 y cabeceras OpenSSL, ejecutar `./build-all.sh`.
          Se generan `native/frontend` y `native/etsc`.
          Para compilar Estatic: `export ESTC_ROOT="$(pwd)"` y
          `./native/etsc build proyecto/main.ets --no-progress`.
          La portabilidad a otros sistemas requiere adaptar las interfaces POSIX.
          MD
          (cd "$d" && find . -type f | sort > files.txt)
          if find "$d" -type f \( -name '*.ets' -o -name '*.ts' -a ! -name '*.d.ts' -o -name '*.o' -o -name '*.a' -o -name '*.so' \) | grep .; then
            echo 'El paquete contiene fuentes no portables o artefactos compilados' >&2
            exit 1
          fi
      - name: Publicar ZIP de fuentes C++ sin binarios
        uses: actions/upload-artifact@v4
        with:
          name: etsc-bootstrap-cpp-sources
          path: dist/etsc-bootstrap-cpp/
          if-no-files-found: error
